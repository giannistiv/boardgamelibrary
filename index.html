// ── Board South: scoring-formula legend + recent-plays list ──
// Rendered beneath the Board South leaderboard. The legend documents the exact
// Elo math (so the +/- numbers are explainable), and the plays list shows each
// game's scoreboard with every player's point swing for that play.

function _boardSouthFormulaHtml(year) {
  return `<div class="bs-formula">
    <div class="bs-formula-head">📐 How the +/- is calculated</div>
    <div class="bs-formula-body">
      <p>Everyone resets to <b>R&nbsp;=&nbsp;1000</b> on January&nbsp;1 (${year}). Each play is scored as a mini round-robin: you're compared head-to-head with every other ranked player at the table, and your <b>+/-</b> for that play is the sum of all those pairings.</p>
      <div class="bs-formula-eq">
        <div>Expected result against one opponent:</div>
        <code>E = 1 / ( 1 + 10^((R<sub>opp</sub> − R<sub>you</sub>) / 400) )</code>
        <div>Points earned from that pairing:</div>
        <code>Δ = K · w · (S − E)&nbsp;&nbsp;— a loss is also × L</code>
      </div>
      <ul class="bs-formula-legend">
        <li><b>R</b> — your current rating. Everyone starts at <b>1000</b> and the board resets every January&nbsp;1.</li>
        <li><b>E</b> — your <i>expected</i> score (between 0 and 1): how likely the rating gap said you were to beat that opponent. A 400-point lead ≈ a 91% expectation.</li>
        <li><b>S</b> — the <i>actual</i> result of the pairing: <b>1</b> if you finished ahead of them, <b>0</b> if behind. A tie between two players cancels — that pairing scores nothing for either.</li>
        <li><b>K</b> — the step size (how fast your rating moves): <b>48</b> while you have fewer than 5 games this year (shown as <b>PROV</b>), then <b>32</b> afterwards.</li>
        <li><b>w</b> — game weight = BGG complexity ÷ 5. A heavy weight-5 game pays full value (×1.0); a light weight-2.5 filler pays half (×0.5). Unknown weight defaults to 2.5.</li>
        <li><b>N</b> — the number of ranked players in the play.</li>
        <li><b>L</b> — loss softener = 3 ÷ N, capped between 0.7 and 1.0, applied <i>only</i> to points you lose — so finishing last in a big group costs less per opponent than losing a one-on-one.</li>
      </ul>
      <p class="bs-formula-tldr"><b>In plain words:</b> beating someone you were already expected to beat earns only a little; upsetting a higher-rated player earns a lot. Heavier games count for more than fillers, a newcomer's rating swings faster for their first five games, and one rough night in a crowded game won't sink you.</p>
    </div>
  </div>`;
}

// Open a game's modal from the Board South plays list (inline onclick so it
// survives the innerHTML copy that showBoardSouthView() does).
window.__bsOpenGame = function(bggId) {
  const g = (typeof findGameByBggId === 'function') ? findGameByBggId(Number(bggId)) : null;
  if (g && typeof openModal === 'function') { try { openModal(g); } catch (_) {} }
};

// Expand/collapse the "rest" of the Board South plays list.
window.__bsTogglePlays = function(btn) {
  const wrap = document.getElementById('bs-plays-list');
  if (!wrap) return;
  const expanded = wrap.classList.toggle('expanded');
  btn.textContent = expanded
    ? 'Show fewer plays'
    : ('Show all ' + (btn.dataset.total || '') + ' plays');
};

function _boardSouthPlaysSectionHtml() {
  const currentYear = new Date().getFullYear();
  const yearStart = _yearStartCutoff();
  const INITIAL = 6;

  let perPlay;
  try { perPlay = _computePerPlayElo('south'); } catch (_) { perPlay = new Map(); }

  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  // Collect this year's Board South plays, keeping the PLAY_HISTORY array index
  // so the per-play delta key (`${bggId}|${date}|${idx}`) lines up.
  const plays = [];
  for (const bggId in PLAY_HISTORY) {
    PLAY_HISTORY[bggId].forEach((p, idx) => {
      if (!p || !p.date || !Array.isArray(p.sc)) return;
      if (p.date < yearStart) return;
      if (!_isBoardSouthPlay(p)) return;
      plays.push({ bggId: Number(bggId), idx, p });
    });
  }
  // Newest first. When two plays share the same timestamp they were logged
  // together in one upload (BGStats stamps a whole batch identically), so the
  // timestamp can't tell them apart. Break that tie in natural insertion order
  // (ascending) rather than reversed — this matches the profile "latest plays"
  // list and keeps a day's later-played games sitting above the earlier ones.
  plays.sort((a, b) => {
    const at = a.p.t || a.p.date, bt = b.p.t || b.p.date;
    if (at !== bt) return bt.localeCompare(at);
    if (a.bggId !== b.bggId) return a.bggId - b.bggId;
    return a.idx - b.idx;
  });

  const formula = _boardSouthFormulaHtml(currentYear);

  if (plays.length === 0) {
    return `<div class="bs-plays-section">
      ${formula}
      <div class="bs-plays-head">🎲 Board South Plays · ${currentYear}</div>
      <div class="lb-empty">No Board South plays recorded yet this year.</div>
    </div>`;
  }

  const rowsHtml = plays.map((entry, i) => {
    const { bggId, idx, p } = entry;
    const game = findGameByBggId(bggId);
    const name = game ? game.name : ('Game #' + bggId);
    const deltas = perPlay.get(`${bggId}|${p.date}|${idx}`) || null;

    // Order the scoreboard by computed rank (so lower-score-wins games still
    // list the winner first); fall back to win-flag then original order.
    const ranks = _leaderboardRanksForPlay(p.sc, bggId) || [];
    const rankByName = {};
    for (const r of ranks) {
      const m = NAME_MAP[r.player] || r.player;
      if (rankByName[m] == null || r.rank < rankByName[m]) rankByName[m] = r.rank;
    }
    const indexed = p.sc.map((s, k) => ({ s, k, rank: rankByName[NAME_MAP[s.n] || s.n] }));
    indexed.sort((a, b) => {
      if (a.rank != null && b.rank != null && a.rank !== b.rank) return a.rank - b.rank;
      const aw = !!a.s.w, bw = !!b.s.w;
      if (aw !== bw) return aw ? -1 : 1;
      return a.k - b.k;
    });

    const sb = indexed.map(({ s }) => {
      const canon = NAME_MAP[s.n] || s.n;
      const cls = ['bs-sb-name'];
      if (s.w) cls.push('winner');
      const role = s.r ? ` <span class="bs-sb-role">(${esc(s.r)})</span>` : '';
      const score = (s.s != null && s.s !== '') ? esc(s.s) : '—';
      let dHtml = '<span class="bs-sb-delta"></span>';
      if (deltas && Object.prototype.hasOwnProperty.call(deltas, canon)) {
        const d = deltas[canon];
        const c = d > 0 ? 'pos' : (d < 0 ? 'neg' : '');
        const sign = d > 0 ? '+' : '';
        dHtml = `<span class="bs-sb-delta ${c}">${sign}${d.toFixed(1)}</span>`;
      }
      return `<div class="bs-sb-row">
        <span class="${cls.join(' ')}">${esc(canon)}${role}</span>
        <span class="bs-sb-score">${score}</span>
        ${dHtml}
      </div>`;
    }).join('');

    const metaBits = [_fmtDateShort(p.date)];
    if (p.b) metaBits.push(esc(p.b));
    if (p.l && p.l !== 'Board South') metaBits.push(esc(p.l));
    metaBits.push(`${p.sc.length} player${p.sc.length !== 1 ? 's' : ''}`);

    const localCover = bggId >= 0 ? `images/${bggId}.jpg` : '';
    const fallback = ((game && game.urlImage) || '').replace(/'/g, "\\'");
    const cover = (localCover || fallback)
      ? `<img class="bs-play-cover" src="${localCover || fallback}" alt="" loading="lazy" onerror="window.__lpmImgFallback(this, '${fallback}')">`
      : '<div class="bs-play-cover"></div>';

    const extraCls = i >= INITIAL ? ' extra' : '';
    return `<div class="bs-play-row${extraCls}" onclick="window.__bsOpenGame(${bggId})">
      <div class="bs-play-top">
        ${cover}
        <div class="bs-play-info">
          <div class="bs-play-name">${esc(name)}</div>
          <div class="bs-play-meta">${metaBits.join(' · ')}</div>
        </div>
      </div>
      <div class="bs-scoreboard">${sb}</div>
    </div>`;
  }).join('');

  const moreBtn = plays.length > INITIAL
    ? `<button class="bs-plays-more" data-total="${plays.length}" onclick="window.__bsTogglePlays(this)">Show all ${plays.length} plays</button>`
    : '';

  return `<div class="bs-plays-section">
    ${formula}
    <div class="bs-plays-head">🎲 Board South Plays · ${currentYear}</div>
    <div class="bs-plays-list" id="bs-plays-list">${rowsHtml}</div>
    ${moreBtn}
  </div>`;
}

function showBoardSouthView() {
  const container = document.getElementById('boardsouth-view');
  if (_bsSubTab === 'vote') {
    _renderBoardSouthVoteView(container);
    return;
  }
  // Render BS leaderboard wrapped in the BS sub-tab nav so the user can flip
  // between Leaderboard and Vote inside the Board South tab.
  const subTabsHtml = `
    <div class="bs-subtabs">
      <button class="bs-subtab active" data-bs-sub="leaderboard">🏆 Leaderboard</button>
      <button class="bs-subtab" data-bs-sub="vote">🗳️ Vote</button>
    </div>`;
  // Render leaderboard content into a temporary host, then prepend sub-tabs.
  const host = document.createElement('div');
  _renderEloLeaderboardInto(host, 'south');
  container.innerHTML = subTabsHtml + host.innerHTML;
  // Re-wire the visit-player handlers since we copied innerHTML.
  container.querySelectorAll('[data-visit-player]').forEach(el => {
    el.addEventListener('click', () => {
      showStatsView(el.dataset.visitPlayer, 'visiting');
      window.scrollTo(0, 0);
    });
  });
  container.querySelectorAll('[data-bs-sub]').forEach(el => {
    el.addEventListener('click', () => {
      const s = el.dataset.bsSub;
      if (s !== _bsSubTab) {
        _bsSubTab = s;
        showBoardSouthView();
      }
    });
  });
  window.scrollTo(0, 0);
}

// ── Board South: "What to play next?" voting view ──
let _bsvSearchQuery = ''; // current aggregate-list filter
let _bsvSearchModalOpen = false;

const _BSV_PLACEHOLDER = 'images/game-placeholder.svg';

function _bsvCoverHtml(game, size) {
  // size is the CSS size class suffix (my / agg / modal)
  const cls = `bsv-${size}thumb`;
  const local = (game && game.bggId >= 0) ? `images/${game.bggId}.jpg` : '';
  const fallback = (game && game.urlImage || '').replace(/'/g, "\\'");
  // Resolution chain: local → urlImage → generic placeholder. Always render
  // an <img> so the visual is consistent (no empty divs in the list).
  const initialSrc = local || fallback || _BSV_PLACEHOLDER;
  return `<div class="${cls}"><img src="${initialSrc}" alt="" loading="lazy"
    onerror="window.__bsvImgFallback(this, '${fallback}')"></div>`;
}

window.__bsvImgFallback = function(img, fallback) {
  if (!img.dataset.bsvFb && fallback) {
    img.dataset.bsvFb = '1';
    img.src = fallback;
    return;
  }
  // Final fallback: a generic dice placeholder so the row never goes blank.
  if (img.src.indexOf('game-placeholder.svg') === -1) {
    img.src = 'images/game-placeholder.svg';
    return;
  }
  // If even the placeholder failed for some reason, hide the image cleanly.
  img.style.display = 'none';
};

function _renderBoardSouthVoteView(container) {
  const currentYear = new Date().getFullYear();
  const voter = _activeBoardSouthVoter();
  const lib = _bsvLibrary;
  const myList = voter ? (_bsvGetVotes(lib)[voter] || []) : [];

  const libTabsHtml = `
    <div class="bsv-lib-tabs">
      ${BSV_LIBRARIES.map(L => `
        <button class="bsv-lib-tab${L === lib ? ' active' : ''}" data-bsv-lib="${L}">
          ${BSV_LIB_LABEL[L]}
        </button>`).join('')}
    </div>`;

  const tabsHtml = `
    <div class="bs-subtabs">
      <button class="bs-subtab" data-bs-sub="leaderboard">🏆 Leaderboard</button>
      <button class="bs-subtab active" data-bs-sub="vote">🗳️ Vote</button>
    </div>
    ${libTabsHtml}`;

  // Permission notice for non-voters
  const permissionHtml = voter ? '' : `
    <div class="bsv-permission">
      Only Board South regulars can vote. ${localStorage.getItem('bgl-player')
        ? `Logged in as <b>${localStorage.getItem('bgl-player')}</b> — view-only access.`
        : 'Pick your name from the player list to participate.'}
    </div>`;

  // ── My priority list ──
  let myListHtml = '';
  if (voter) {
    // Add-game button sits at the top so it's always reachable without
    // scrolling past the existing list.
    myListHtml = `<button class="bsv-add-btn" id="bsv-open-search">+ Vote a game from the library</button>`;
    if (myList.length === 0) {
      myListHtml += `<div class="bsv-empty">You haven't voted yet. Tap above to add games you want to play next.</div>`;
    } else {
      myListHtml += '<div class="bsv-mylist">' + myList.map((bggId, idx) => {
        const game = _bsvFindGame(lib, bggId);
        const name = game ? game.name : `Game #${bggId}`;
        const cover = _bsvCoverHtml(game, 'my');
        const upDisabled = idx === 0 ? 'disabled' : '';
        const downDisabled = idx === myList.length - 1 ? 'disabled' : '';
        return `<div class="bsv-myitem" draggable="true" data-bsv-idx="${idx}" data-bgg-id="${bggId}">
          <div class="bsv-myrank" title="Drag to reorder">
            <span class="bsv-myrank-num">${idx + 1}</span>
            <span class="bsv-mygrip">⠿</span>
          </div>
          ${cover}
          <div class="bsv-myname">${_escapeHtml(name)}</div>
          <div class="bsv-myactions">
            <button class="bsv-mybtn" data-bsv-act="up" ${upDisabled} title="Move up">▲</button>
            <button class="bsv-mybtn" data-bsv-act="down" ${downDisabled} title="Move down">▼</button>
            <button class="bsv-mybtn danger" data-bsv-act="remove" title="Remove">✕</button>
          </div>
        </div>`;
      }).join('') + '</div>';
    }
  }

  // ── Aggregate ranking ──
  const ranking = _computeBoardSouthVoteRanking(lib);
  const q = (_bsvSearchQuery || '').trim().toLowerCase();
  const filtered = q
    ? ranking.filter(r => {
        const g = _bsvFindGame(lib, r.bggId);
        return g && g.name && g.name.toLowerCase().includes(q);
      })
    : ranking;

  // The owner of the currently-selected library may prune entries from the
  // group ranking (e.g. games they no longer own / are unavailable). This
  // strips the bggId from every voter's list for the active library.
  const isLibOwner = voter && voter === BSV_LIB_OWNER[lib];

  let aggHtml;
  if (ranking.length === 0) {
    aggHtml = `<div class="bsv-empty">No votes yet. Be the first to suggest what to play next!</div>`;
  } else if (filtered.length === 0) {
    aggHtml = `<div class="bsv-empty">No voted games match "${_escapeHtml(q)}".</div>`;
  } else {
    const maxVotes = ranking[0].votes;
    aggHtml = '<div class="bsv-agg-list">' + filtered.map((r, i) => {
      const game = _bsvFindGame(lib, r.bggId);
      const name = game ? game.name : `Game #${r.bggId}`;
      const cover = _bsvCoverHtml(game, 'agg');
      const isHot = r.votes === maxVotes;
      const voterStr = r.voters
        .sort((a, b) => a.position - b.position)
        .map(v => {
          const isYou = voter && v.name === voter;
          const cls = isYou ? 'you' : '';
          return `<span class="${cls}">${_escapeHtml(v.name)}#${v.position}</span>`;
        })
        .join(', ');
      const removeBtnHtml = isLibOwner
        ? `<button class="bsv-aggremove" data-bsv-remove="${r.bggId}" title="Remove from group ranking — you no longer have this game" aria-label="Remove game">✕</button>`
        : '';
      return `<div class="bsv-aggrow${isLibOwner ? ' has-remove' : ''}" data-bgg-id="${r.bggId}">
        <div class="bsv-aggrank">#${i + 1}</div>
        ${cover}
        <div>
          <div class="bsv-aggname">${_escapeHtml(name)}</div>
          <div class="bsv-aggvoters">${voterStr}</div>
        </div>
        <div class="bsv-aggvotes ${isHot ? 'hot' : ''}">${r.votes}</div>
        ${removeBtnHtml}
      </div>`;
    }).join('') + '</div>';
  }

  container.innerHTML = `
    <div class="lb-header">
      <div class="lb-title">What to Play Next?</div>
      <div class="lb-count">${ranking.length} game${ranking.length !== 1 ? 's' : ''} voted</div>
    </div>
    ${tabsHtml}
    ${permissionHtml}
    ${voter ? `
      <div class="bsv-section-title">Your Priority List ${myList.length ? `· ${myList.length}` : ''}</div>
      ${myListHtml}
    ` : ''}
    <div class="bsv-section-title">Group Ranking ${currentYear}</div>
    <input type="text" class="bsv-search-bar" id="bsv-search-agg"
           placeholder="Search voted games…" value="${_escapeHtml(_bsvSearchQuery)}">
    ${aggHtml}
    <div class="lb-explain">
      <b>How voting works:</b> Each Board South regular adds the games they want to play next, ordered by personal priority (top = most wanted). Games are ranked first by total vote count, then by combined priority — a game placed #1 by everyone outranks a game placed #5 by everyone, even with the same vote count. Reorder your list with ▲/▼ or drag to break ties in your favour. Votes are saved live and shared across devices.
    </div>`;

  // Wire BS sub-tabs
  container.querySelectorAll('[data-bs-sub]').forEach(el => {
    el.addEventListener('click', () => {
      const s = el.dataset.bsSub;
      if (s !== _bsSubTab) {
        _bsSubTab = s;
        showBoardSouthView();
      }
    });
  });

  // Wire library tabs (Στιβ ↔ Γιαννης)
  container.querySelectorAll('[data-bsv-lib]').forEach(el => {
    el.addEventListener('click', () => {
      const L = el.dataset.bsvLib;
      if (L && L !== _bsvLibrary && BSV_LIBRARIES.includes(L)) {
        _bsvLibrary = L;
        _bsvSearchQuery = '';
        showBoardSouthView();
      }
    });
  });

  // Voting actions on my list
  if (voter) {
    container.querySelectorAll('.bsv-myitem').forEach(item => {
      const idx = Number(item.dataset.bsvIdx);
      item.querySelectorAll('[data-bsv-act]').forEach(btn => {
        btn.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          const act = btn.dataset.bsvAct;
          const list = (_bsvGetVotes(lib)[voter] || []).slice();
          if (act === 'remove') {
            list.splice(idx, 1);
          } else if (act === 'up' && idx > 0) {
            const tmp = list[idx];
            list[idx] = list[idx - 1];
            list[idx - 1] = tmp;
          } else if (act === 'down' && idx < list.length - 1) {
            const tmp = list[idx];
            list[idx] = list[idx + 1];
            list[idx + 1] = tmp;
          } else {
            return;
          }
          _bsvGetVotes(lib)[voter] = list;
          showBoardSouthView();
          persistBoardSouthVote(voter, list, lib);
        });
      });
    });

    // Unified pointer-based drag-and-drop reordering (works for mouse + touch).
    // Live-swaps DOM rows during the drag so the user sees the new ordering
    // immediately; persists once on pointerup so we don't churn Firebase.
    _wireBoardSouthDrag(container, voter, lib);

    const openBtn = container.querySelector('#bsv-open-search');
    if (openBtn) openBtn.addEventListener('click', _openBoardSouthAddModal);
  }

  // Aggregate search
  const searchInput = container.querySelector('#bsv-search-agg');
  if (searchInput) {
    searchInput.addEventListener('input', (ev) => {
      _bsvSearchQuery = ev.target.value;
      // Re-render only the aggregate region for snappier typing
      showBoardSouthView();
      // Restore focus + cursor
      const fresh = document.getElementById('bsv-search-agg');
      if (fresh) {
        fresh.focus();
        const len = fresh.value.length;
        fresh.setSelectionRange(len, len);
      }
    });
  }

  // Library-owner can prune a game from the group ranking (removes that
  // bggId from every voter's list for the active library, both in memory
  // and in Firebase). Stops propagation so the row-level click below
  // doesn't also open the game's modal.
  if (isLibOwner) {
    container.querySelectorAll('[data-bsv-remove]').forEach(btn => {
      btn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const bggId = Number(btn.dataset.bsvRemove);
        if (!Number.isFinite(bggId)) return;
        const game = _bsvFindGame(lib, bggId);
        const gameName = game ? game.name : `game #${bggId}`;
        const ok = window.confirm(`Remove "${gameName}" from the ${BSV_LIB_LABEL[lib]} group ranking?\n\nThis clears the game from every voter's list for this library.`);
        if (!ok) return;
        const votesNow = _bsvGetVotes(lib);
        const updates = [];
        for (const v in votesNow) {
          const cur = votesNow[v] || [];
          if (!cur.includes(bggId)) continue;
          const next = cur.filter(id => id !== bggId);
          votesNow[v] = next;
          updates.push(persistBoardSouthVote(v, next, lib));
        }
        showBoardSouthView();
        await Promise.all(updates);
      });
    });
  }

  // Click an aggregate row → open the game's modal (only when the underlying
  // game exists in the global library — Γιαννης-only games don't have a
  // detail modal yet so they're silently no-ops).
  container.querySelectorAll('.bsv-aggrow').forEach(el => {
    el.addEventListener('click', (ev) => {
      // Skip if the click originated from the remove button.
      if (ev.target.closest('[data-bsv-remove]')) return;
      const bggId = Number(el.dataset.bggId);
      const game = findGameByBggId(bggId);
      if (game && typeof openModal === 'function') {
        try { openModal(game); } catch (_) {}
      }
    });
  });

  if (_bsvSearchModalOpen) _openBoardSouthAddModal(true);

  window.scrollTo(0, 0);
}

// Unified pointer-based drag for the priority list. Works on mouse + touch.
// Live-reorders DOM rows as the user drags, and persists once on release.
function _wireBoardSouthDrag(container, voter, library) {
  const lib = library || _bsvLibrary;
  let drag = null;

  const items = () => Array.from(container.querySelectorAll('.bsv-myitem'));

  const onDown = (ev) => {
    // Ignore right-click.
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    // A drag only starts from the rank handle (.bsv-myrank). Touching the
    // cover/name lets the page scroll normally — fixes the mobile issue
    // where any touch on a row was hijacked into a reorder.
    if (!ev.target.closest('.bsv-myrank')) return;
    const item = ev.currentTarget;
    if (!item) return;
    ev.preventDefault();

    drag = {
      item,
      startY: ev.clientY,
      lastY: ev.clientY,
      pointerId: ev.pointerId,
      moved: false,
    };
    item.classList.add('dragging');
    try { item.setPointerCapture(ev.pointerId); } catch (_) {}
  };

  const onMove = (ev) => {
    if (!drag) return;
    if (ev.pointerId !== drag.pointerId) return;
    ev.preventDefault();

    const dy = ev.clientY - drag.lastY;
    if (Math.abs(ev.clientY - drag.startY) > 3) drag.moved = true;

    // Visually offset the dragged item so the user sees it follow the pointer.
    const currentTransform = drag.item.style.transform || '';
    const m = currentTransform.match(/translateY\(([-\d.]+)px\)/);
    const prev = m ? Number(m[1]) : 0;
    drag.item.style.transform = `translateY(${prev + dy}px)`;
    drag.lastY = ev.clientY;

    // Find the sibling currently under the pointer (excluding the dragged
    // item and ignoring its visual translation).
    const all = items();
    for (const other of all) {
      if (other === drag.item) continue;
      // Use the un-transformed bounding rect of `other` since it's static.
      const r = other.getBoundingClientRect();
      const mid = (r.top + r.bottom) / 2;
      if (ev.clientY < r.top || ev.clientY > r.bottom) continue;
      // Reorder DOM: insert dragged before/after `other` based on direction
      const fromBefore = drag.item.compareDocumentPosition(other) & Node.DOCUMENT_POSITION_FOLLOWING;
      // fromBefore is non-zero when `other` follows the dragged item in DOM
      if (fromBefore) {
        if (ev.clientY > mid) other.after(drag.item);
        else continue;
      } else {
        if (ev.clientY < mid) other.before(drag.item);
        else continue;
      }
      // Clear the visual offset since the row's natural position has moved.
      drag.item.style.transform = '';
      drag.startY = ev.clientY;
      drag.lastY = ev.clientY;
      // Update the rank label for every item to reflect the new order.
      _refreshBsvRanks(container);
      break;
    }
  };

  const onUp = (ev) => {
    if (!drag) return;
    if (ev.pointerId !== drag.pointerId) return;
    drag.item.classList.remove('dragging');
    drag.item.style.transform = '';
    try { drag.item.releasePointerCapture(ev.pointerId); } catch (_) {}

    // Compute the final order from the DOM and persist if changed.
    const newOrder = items().map(el => Number(el.dataset.bggId)).filter(Number.isFinite);
    drag = null;

    const before = (_bsvGetVotes(lib)[voter] || []).map(Number);
    const same = before.length === newOrder.length && before.every((v, i) => v === newOrder[i]);
    if (!same) {
      _bsvGetVotes(lib)[voter] = newOrder;
      persistBoardSouthVote(voter, newOrder, lib);
      // Re-render so the aggregate ranking + voter labels update.
      showBoardSouthView();
    }
  };

  items().forEach(item => {
    item.addEventListener('pointerdown', onDown);
    item.addEventListener('pointermove', onMove);
    item.addEventListener('pointerup', onUp);
    item.addEventListener('pointercancel', onUp);
  });
}

// Update the visible "1, 2, 3…" rank labels and the up/down disabled
// states after a live drag-reorder, without a full re-render.
function _refreshBsvRanks(container) {
  const items = container.querySelectorAll('.bsv-myitem');
  const last = items.length - 1;
  items.forEach((item, i) => {
    item.dataset.bsvIdx = String(i);
    const rankEl = item.querySelector('.bsv-myrank-num');
    if (rankEl) rankEl.textContent = String(i + 1);
    const upBtn = item.querySelector('[data-bsv-act="up"]');
    const downBtn = item.querySelector('[data-bsv-act="down"]');
    if (upBtn) upBtn.disabled = i === 0;
    if (downBtn) downBtn.disabled = i === last;
  });
}

function _openBoardSouthAddModal(skipFlagSet) {
  const voter = _activeBoardSouthVoter();
  if (!voter) return;
  if (!skipFlagSet) _bsvSearchModalOpen = true;
  const lib = _bsvLibrary;

  // Avoid stacking duplicates
  document.querySelectorAll('.bsv-modal-overlay').forEach(el => el.remove());

  const overlay = document.createElement('div');
  overlay.className = 'bsv-modal-overlay';

  const myListSet = new Set((_bsvGetVotes(lib)[voter] || []).map(Number));

  // Library catalogue depends on which collection we're voting on.
  // Skip expansions and campaign/legacy games when those flags are known
  // (the Γιαννης catalogue doesn't carry expansion data, so isExpansion is
  // guarded).
  const _safeIsExpansion = (g) => { try { return isExpansion(g); } catch (_) { return false; } };
  const _safeIsCampaign  = (g) => { try { return isCampaign(g);  } catch (_) { return false; } };
  const libraryGames = _bsvLibraryCatalogue(lib)
    .filter(g => !_safeIsExpansion(g) && !_safeIsCampaign(g))
    .slice()
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  // Parse a game's player range into a [min, max] tuple for filtering.
  const parsePlayers = (g) => {
    if (!g || !g.players) return [null, null];
    const m = String(g.players).match(/^(\d+)(?:\s*-\s*(\d+))?/);
    if (!m) return [null, null];
    const min = Number(m[1]);
    const max = m[2] ? Number(m[2]) : min;
    return [min, max];
  };

  overlay.innerHTML = `
    <div class="bsv-modal" role="dialog" aria-modal="true">
      <div class="bsv-modal-head">
        <div class="bsv-modal-title">Add a game · ${BSV_LIB_LABEL[lib]}</div>
        <button class="bsv-modal-close" id="bsv-modal-close" aria-label="Close">×</button>
      </div>
      <input type="text" class="bsv-search-bar" id="bsv-modal-search" placeholder="Search ${BSV_LIB_LABEL[lib]}…" autocomplete="off">
      <div class="bsv-modal-filters">
        <label class="bsv-filter">
          <span>Players</span>
          <select id="bsv-f-players">
            <option value="">Any</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6+</option>
          </select>
        </label>
        <label class="bsv-filter">
          <span>Weight</span>
          <select id="bsv-f-weight">
            <option value="">Any</option>
            <option value="light">Light (≤ 2)</option>
            <option value="medium">Medium (2–3)</option>
            <option value="heavy">Heavy (3+)</option>
          </select>
        </label>
        <label class="bsv-filter">
          <span>Sort</span>
          <select id="bsv-f-sort">
            <option value="name">Name</option>
            <option value="rating">BGG rating</option>
            <option value="weight">Weight</option>
          </select>
        </label>
      </div>
      <div class="bsv-modal-count" id="bsv-modal-count"></div>
      <div class="bsv-modal-results" id="bsv-modal-results"></div>
    </div>`;

  document.body.appendChild(overlay);
  // Lock background scroll while the modal is open so swiping on iOS
  // doesn't accidentally move the BS view underneath.
  const _prevBodyOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';

  const close = () => {
    _bsvSearchModalOpen = false;
    overlay.remove();
    document.body.style.overflow = _prevBodyOverflow;
  };
  overlay.addEventListener('click', (ev) => { if (ev.target === overlay) close(); });
  overlay.querySelector('#bsv-modal-close').addEventListener('click', close);

  const resultsEl = overlay.querySelector('#bsv-modal-results');
  const searchEl = overlay.querySelector('#bsv-modal-search');
  const playersEl = overlay.querySelector('#bsv-f-players');
  const weightEl = overlay.querySelector('#bsv-f-weight');
  const sortEl = overlay.querySelector('#bsv-f-sort');
  const countEl = overlay.querySelector('#bsv-modal-count');

  const renderResults = () => {
    const q = (searchEl.value || '').trim().toLowerCase();
    const wantPlayers = playersEl.value ? Number(playersEl.value) : null;
    const wantWeight = weightEl.value;
    const sortBy = sortEl.value || 'name';

    let matches = libraryGames.filter(g => {
      if (q && !(g.name || '').toLowerCase().includes(q)) return false;
      if (wantPlayers != null) {
        const [mn, mx] = parsePlayers(g);
        if (mn == null) return false;
        if (wantPlayers === 6) {
          // "6+" → any game whose max ≥ 6
          if (mx < 6) return false;
        } else if (!(mn <= wantPlayers && mx >= wantPlayers)) {
          return false;
        }
      }
      if (wantWeight) {
        const cx = Number(g.complexity);
        if (!Number.isFinite(cx)) return false;
        if (wantWeight === 'light' && cx > 2) return false;
        if (wantWeight === 'medium' && (cx < 2 || cx > 3)) return false;
        if (wantWeight === 'heavy' && cx < 3) return false;
      }
      return true;
    });

    if (sortBy === 'rating') {
      matches.sort((a, b) => (Number(b.bggRating) || 0) - (Number(a.bggRating) || 0)
        || (a.name || '').localeCompare(b.name || ''));
    } else if (sortBy === 'weight') {
      matches.sort((a, b) => (Number(a.complexity) || 0) - (Number(b.complexity) || 0)
        || (a.name || '').localeCompare(b.name || ''));
    } else {
      matches.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    }

    countEl.textContent = `${matches.length} game${matches.length !== 1 ? 's' : ''}`;

    if (matches.length === 0) {
      resultsEl.innerHTML = `<div class="bsv-empty">${q ? `No games match "${_escapeHtml(q)}".` : 'No games match these filters.'}</div>`;
      return;
    }
    resultsEl.innerHTML = matches.map(g => {
      const cover = _bsvCoverHtml(g, 'modal');
      const already = myListSet.has(Number(g.bggId));
      const meta = [
        g.players ? _escapeHtml(g.players) + 'p' : '',
        g.complexity ? `wt ${Number(g.complexity).toFixed(1)}` : '',
        g.bggRating ? `★ ${Number(g.bggRating).toFixed(1)}` : '',
      ].filter(Boolean).join(' · ');
      return `<div class="bsv-modal-row" data-bgg-id="${g.bggId}">
        ${cover}
        <div>
          <div class="bsv-modal-name">${_escapeHtml(g.name)}</div>
          <div class="bsv-modal-meta">${meta}</div>
        </div>
        ${already ? '<div class="bsv-modal-already">In list</div>' : '<div style="color:var(--accent);font-size:1.2rem;font-weight:700">+</div>'}
      </div>`;
    }).join('');

    resultsEl.querySelectorAll('[data-bgg-id]').forEach(row => {
      row.addEventListener('click', async () => {
        const bggId = Number(row.dataset.bggId);
        if (!Number.isFinite(bggId)) return;
        const list = (_bsvGetVotes(lib)[voter] || []).slice();
        if (list.includes(bggId)) {
          // Already there — close modal anyway
          close();
          showBoardSouthView();
          return;
        }
        list.push(bggId);
        _bsvGetVotes(lib)[voter] = list;
        close();
        showBoardSouthView();
        persistBoardSouthVote(voter, list, lib);
      });
    });
  };

  searchEl.addEventListener('input', renderResults);
  playersEl.addEventListener('change', renderResults);
  weightEl.addEventListener('change', renderResults);
  sortEl.addEventListener('change', renderResults);
  // Focus the search box and render initial results
  setTimeout(() => searchEl.focus(), 30);
  renderResults();
}

function _escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function _renderInsightsPlayers(players, wrColor) {
  return players.map(p => {
    const initial = p.name.charAt(0).toUpperCase();
    return `<div class="stats-player-row" data-visit-player="${p.name.replace(/"/g, '&quot;')}">
      <div class="stats-player-avatar">${initial}</div>
      <div class="stats-player-info">
        <div class="stats-player-info-name">${p.name}</div>
        <div class="stats-player-info-detail">${p.plays} plays &middot; ${p.games} games &middot; ${p.wr}% WR</div>
      </div>
      <div class="stats-player-wr" style="color:${wrColor(p.wr)}">${p.wr}%</div>
    </div>`;
  }).join('');
}

function _wireInsightsPlayerClicks(container) {
  container.querySelectorAll('[data-visit-player]').forEach(el => {
    el.addEventListener('click', () => {
      showStatsView(el.dataset.visitPlayer, 'visiting');
      window.scrollTo(0, 0);
    });
  });
}

// ── Favorites System ──
let favoritesCache = {};
let favoritesCacheReady = false;

function _loadFavoritesFromLocal() {
  try {
    const raw = localStorage.getItem('bgl-favorites');
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function _saveFavoritesToLocal() {
  try { localStorage.setItem('bgl-favorites', JSON.stringify(favoritesCache)); } catch (e) {}
}

async function loadAllFavorites() {
  const local = _loadFavoritesFromLocal();
  favoritesCache = local;
  favoritesCacheReady = true;
  if (!FIREBASE_DB) return;
  try {
    const res = await fetch(`${FIREBASE_DB}/favorites.json`);
    const data = await res.json();
    if (data) {
      for (const key in data) {
        if (Array.isArray(data[key]) && data[key].length > 0) {
          favoritesCache[key] = data[key];
        }
      }
      _saveFavoritesToLocal();
    } else {
      const localKeys = Object.keys(local).filter(k => Array.isArray(local[k]) && local[k].length > 0);
      if (localKeys.length > 0) {
        await fetch(`${FIREBASE_DB}/favorites.json`, {
          method: 'PUT',
          body: JSON.stringify(local)
        });
      }
    }
  } catch (e) {
    console.warn('Failed to load favorites from Firebase:', e);
  }
}

function getPlayerFavorites(playerName) {
  let f = favoritesCache[playerName];
  // Defensive: if a rename left nothing under the display name, fall back to
  // the original canonical name's favorites.
  if ((!Array.isArray(f) || !f.length) && typeof _origCanon === 'function') {
    const c = _origCanon(playerName);
    if (c !== playerName && Array.isArray(favoritesCache[c]) && favoritesCache[c].length) {
      f = favoritesCache[c];
    }
  }
  return Array.isArray(f) ? f : [];
}

async function saveFavorites(playerName, bggIds) {
  favoritesCache[playerName] = bggIds;
  _saveFavoritesToLocal();
  if (!FIREBASE_DB) return;
  try {
    // Persist under the original canonical name so favorites stay keyed
    // consistently across a rename (everyone else's data is keyed that way).
    await fetch(`${FIREBASE_DB}/favorites/${encodeURIComponent(_origCanon(playerName))}.json`, {
      method: 'PUT',
      body: JSON.stringify(bggIds)
    });
  } catch (e) {
    console.warn('Failed to save favorites to Firebase:', e);
  }
}

async function toggleFavorite(playerName, bggId) {
  const favs = getPlayerFavorites(playerName).slice();
  const idx = favs.indexOf(bggId);
  if (idx >= 0) {
    favs.splice(idx, 1);
  } else {
    if (favs.length >= 4) return false;
    favs.push(bggId);
  }
  await saveFavorites(playerName, favs);
  return true;
}

function isFavorited(playerName, bggId) {
  return getPlayerFavorites(playerName).includes(bggId);
}

function updateFavButton(bggId) {
  const btn = document.getElementById('modal-fav');
  if (!btn) return;
  const player = localStorage.getItem('bgl-player');
  if (!player || bggId <= 0) {
    btn.style.display = 'none';
    return;
  }
  btn.style.display = 'flex';
  const faved = isFavorited(player, bggId);
  const favs = getPlayerFavorites(player);
  const full = favs.length >= 4 && !faved;
  btn.classList.toggle('favorited', faved);
  btn.classList.toggle('full', full);
  btn.title = faved ? 'Remove from favorites' : (full ? 'Favorites full (4/4)' : 'Add to favorites');
  btn.dataset.bggId = bggId;
}

function wireFavButton() {
  const btn = document.getElementById('modal-fav');
  if (btn._wired) return;
  btn._wired = true;
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const player = localStorage.getItem('bgl-player');
    const bggId = Number(btn.dataset.bggId);
    if (!player || !bggId) return;
    if (btn.classList.contains('full') && !btn.classList.contains('favorited')) return;

    // Optimistic update: flip the in-memory state + UI *before* awaiting
    // the Firebase round-trip, so the star colour changes the moment the
    // user taps it. Roll back if the network write fails.
    const favsBefore = getPlayerFavorites(player).slice();
    const idx = favsBefore.indexOf(bggId);
    const next = favsBefore.slice();
    if (idx >= 0) next.splice(idx, 1);
    else if (next.length < 4) next.push(bggId);
    else return;
    favoritesCache[player] = next;
    updateFavButton(bggId);
    // Drop focus / sticky :hover on touch so the colour swap is visible
    // even on iOS where the hover state lingers until the next touch.
    try { btn.blur(); } catch (_) {}

    try {
      await saveFavorites(player, next);
    } catch (err) {
      console.warn('Favorite toggle failed, rolling back:', err);
      favoritesCache[player] = favsBefore;
      updateFavButton(bggId);
    }
  });
}

// When a local images/<bggId>.jpg is missing, fall back to the remote
// urlImage stored on the game. urlImage is populated from BGStats imports
// (the .bgsplay file carries CDN URLs for every game) and persisted to
// Firebase under /gameImages/{bggId} so the cover sticks across reloads
// for hardcoded games too. BGG's xmlapi2 is no longer usable from the
// browser (Bearer auth required), so there is no online lookup fallback.
function _hideImgWithFallback(img){
  img.style.display = 'none';
  if (img.nextElementSibling && img.nextElementSibling.classList.contains('modal-cover-fallback')) {
    img.nextElementSibling.style.display = 'flex';
  }
}
// Image fallback specific to the favorite-picker rows: local → urlImage →
// generic dice placeholder so unowned/uncovered games still render cleanly.
window.__favPickerImgFallback = function(img, urlImage) {
  if (!img.dataset.fbStep) {
    img.dataset.fbStep = '1';
    if (urlImage) { img.src = urlImage; return; }
  }
  if (img.dataset.fbStep !== '2') {
    img.dataset.fbStep = '2';
    img.src = 'images/game-placeholder.svg';
    return;
  }
  img.style.visibility = 'hidden';
};

window.__imgFallback = function(img, bggId){
  // Resolution chain: local file → stored BGG urlImage → final fallback.
  if (!img.dataset.fb) {
    img.dataset.fb = '1';
    const game = findGameByBggId(bggId);
    if (game && game.urlImage) { img.src = game.urlImage; return; }
  }
  // Final fallback. Two contexts keep their nicer specialised fallback: the
  // game modal (a colored box with the game's name) and Category Bingo cells
  // (the name shown inside the square). Everywhere else, show the default
  // dice placeholder instead of leaving a blank gap.
  const sib = img.nextElementSibling;
  const hasModalBox = sib && sib.classList && sib.classList.contains('modal-cover-fallback');
  const hasBingoName = img.parentElement && img.parentElement.querySelector('.ch-bingo-name');
  if (hasModalBox || hasBingoName) {
    _hideImgWithFallback(img);
  } else if (!img.dataset.ph) {
    img.dataset.ph = '1';
    img.style.display = '';
    img.src = 'images/game-placeholder.svg';
  }
};

// ── Game image overrides (Firebase-backed) ──
// Lets us capture urlImage from BGStats imports for hardcoded games whose
// GAMES entry doesn't have one baked in.
async function loadGameImages() {
  if (!FIREBASE_DB) return;
  try {
    const res = await fetch(`${FIREBASE_DB}/gameImages.json`);
    const data = await res.json();
    if (!data) return;
    for (const bggId in data) {
      const url = data[bggId] && data[bggId].url;
      if (!url) continue;
      const g = findGameByBggId(bggId);
      if (g && !g.urlImage) g.urlImage = url;
    }
  } catch (e) {
    console.warn('Failed to load game images from Firebase:', e);
  }
}
async function persistGameImage(bggId, url) {
  if (!FIREBASE_DB || !url) return;
  try {
    await fetch(`${FIREBASE_DB}/gameImages/${encodeURIComponent(bggId)}.json`, {
      method: 'PUT',
      body: JSON.stringify({ url })
    });
  } catch (e) {
    console.warn('Failed to save game image to Firebase:', e);
  }
}

function findGameByBggId(bggId) {
  const num = Number(bggId);
  // Resolution order: the hand-curated shelf and BGStats imports first
  // (richest metadata), then the per-person CSV catalogues so favorites /
  // votes / modals can resolve any owned game even if it's only known from
  // a collection import. Returns the first catalogue that has it.
  return GAMES.find(g => g.bggId === num)
    || EXTRA_GAMES[bggId]
    || (typeof GIANNIS_GAMES !== 'undefined' && GIANNIS_GAMES[num])
    || (typeof LGEORGE_GAMES !== 'undefined' && LGEORGE_GAMES[num])
    || (typeof DIMITRIS_GAMES !== 'undefined' && DIMITRIS_GAMES[num])
    || null;
}

// ── Board South "what to play next" voting (Firebase-backed) ──
// Each BS regular submits an ordered list of bggIds (highest priority first)
// per *library*. Two libraries are voted on independently:
//   - 'stiv'    → games from Στιβ's collection (GAMES + EXTRA_GAMES).
//                 Persisted at /boardSouthVotes/{encName} (legacy path).
//   - 'giannis' → games from Γιαννης Φωτοπουλος's collection (GIANNIS_GAMES).
//                 Persisted at /boardSouthVotesGiannis/{encName}.
const BSV_LIBRARIES = ['stiv', 'giannis', 'lgeorge'];
const BSV_LIB_LABEL = {
  stiv:    "Στιβ's library",
  giannis: "Φωτοπουλος library",
  lgeorge: "LGeorge library",
};
const BSV_LIB_PATH = {
  stiv:    'boardSouthVotes',
  giannis: 'boardSouthVotesGiannis',
  lgeorge: 'boardSouthVotesLGeorge',
};
// Each library has a single canonical owner — that player can prune games
// from the group ranking that they no longer own / aren't available.
const BSV_LIB_OWNER = {
  stiv:    'Στιβ',
  giannis: 'Γιαννης Φωτοπουλος',
  lgeorge: 'LGeorge',
};

let boardSouthVotes = { stiv: {}, giannis: {}, lgeorge: {} };
let _bsvLibrary = 'stiv'; // currently-selected library in the vote view

function _bsVoteEncodeName(name) {
  // Firebase keys can't contain . $ # [ ] / — replace each with _
  return encodeURIComponent(name).replace(/\./g, '%2E');
}

function _bsvGetVotes(library) {
  if (!boardSouthVotes[library]) boardSouthVotes[library] = {};
  return boardSouthVotes[library];
}

async function loadBoardSouthVotes() {
  // Init a namespace for every registered library — adding a new library
  // to BSV_LIBRARIES (e.g. 'lgeorge') used to require a parallel hand-edit
  // here; without it, boardSouthVotes[lib] was undefined and the load
  // silently failed with a TypeError caught by the try/catch below, leading
  // to votes appearing "lost" on every page reload.
  boardSouthVotes = {};
  for (const lib of BSV_LIBRARIES) boardSouthVotes[lib] = {};
  if (!FIREBASE_DB) return;
  await Promise.all(BSV_LIBRARIES.map(async (lib) => {
    try {
      const res = await fetch(`${FIREBASE_DB}/${BSV_LIB_PATH[lib]}.json`);
      const data = await res.json();
      if (!data) return;
      // Defensive: make sure the bucket still exists before writing into it.
      if (!boardSouthVotes[lib]) boardSouthVotes[lib] = {};
      for (const encName in data) {
        const decoded = decodeURIComponent(encName);
        const list = data[encName];
        if (Array.isArray(list)) {
          boardSouthVotes[lib][decoded] = list.map(Number).filter(n => Number.isFinite(n));
        } else if (list && typeof list === 'object') {
          const ordered = Object.keys(list).sort((a, b) => Number(a) - Number(b)).map(k => Number(list[k]));
          boardSouthVotes[lib][decoded] = ordered.filter(n => Number.isFinite(n));
        }
      }
    } catch (e) {
      console.warn(`Failed to load Board South votes (${lib}) from Firebase:`, e);
    }
  }));
}

async function persistBoardSouthVote(voterName, bggIds, library) {
  if (!voterName) return;
  const lib = library || _bsvLibrary;
  const clean = (bggIds || []).map(Number).filter(n => Number.isFinite(n));
  _bsvGetVotes(lib)[voterName] = clean;
  if (!FIREBASE_DB) return;
  try {
    await fetch(`${FIREBASE_DB}/${BSV_LIB_PATH[lib]}/${_bsVoteEncodeName(voterName)}.json`, {
      method: 'PUT',
      body: JSON.stringify(clean),
    });
  } catch (e) {
    console.warn(`Failed to save Board South vote (${lib}) to Firebase:`, e);
  }
}

// Find a game by bggId in the selected library. Falls back through:
//   1. The library's own catalogue (GIANNIS_GAMES for 'giannis', GAMES/EXTRA_GAMES for 'stiv')
//   2. findGameByBggId(bggId) so we still pick up urlImage from any BGStats import
function _bsvFindGame(library, bggId) {
  const id = Number(bggId);
  // Pick the per-library catalogue (Γιαννης or LGeorge), then overlay any
  // imported metadata (urlImage etc.) from EXTRA_GAMES so newly imported
  // BGStats covers show up automatically.
  let base = null;
  if (library === 'giannis')      base = (typeof GIANNIS_GAMES !== 'undefined') ? GIANNIS_GAMES[id] : null;
  else if (library === 'lgeorge') base = (typeof LGEORGE_GAMES !== 'undefined') ? LGEORGE_GAMES[id] : null;
  if (base) {
    const imported = (typeof EXTRA_GAMES !== 'undefined') ? EXTRA_GAMES[id] : null;
    if (imported) return { ...base, urlImage: imported.urlImage || base.urlImage };
    return base;
  }
  return findGameByBggId(id);
}

function _bsvLibraryCatalogue(library) {
  if (library === 'giannis') return (typeof GIANNIS_GAMES !== 'undefined') ? Object.values(GIANNIS_GAMES) : [];
  if (library === 'lgeorge') return (typeof LGEORGE_GAMES !== 'undefined') ? Object.values(LGEORGE_GAMES) : [];
  return (typeof GAMES !== 'undefined') ? GAMES : [];
}

// Returns the canonical name of the currently-logged-in Board South voter,
// or null if the active player isn't allowed to vote.
function _activeBoardSouthVoter() {
  const raw = localStorage.getItem('bgl-player');
  if (!raw) return null;
  const name = NAME_MAP[raw] || raw;
  if (BOARD_SOUTH_REGULARS.has(name)) return name;
  if (typeof name === 'string' && name.includes(' - BS')) return name;
  return null;
}

// Returns the set of all canonical voter names ever seen — both the
// BOARD_SOUTH_REGULARS allowlist and anyone tagged " - BS" from PLAY_HISTORY.
function _allBoardSouthVoterNames() {
  const set = new Set(BOARD_SOUTH_REGULARS);
  for (const bggId in PLAY_HISTORY) {
    for (const play of PLAY_HISTORY[bggId]) {
      if (!play || !Array.isArray(play.sc)) continue;
      for (const s of play.sc) {
        if (s && typeof s.n === 'string' && s.n.includes(' - BS')) {
          set.add(NAME_MAP[s.n] || s.n);
        }
      }
    }
  }
  return set;
}

// Build the aggregate ranking of voted-on games.
// Each voter contributes 1 vote per listed game. Among games with the same
// vote count, sort by the sum of inverse rank (1/position) so games people
// place near the top of their list win ties.
// Average rating given by *app users* to a game (0 when nobody rated it).
// Distinct from the static BGG rating carried on the game object.
function _avgAppRating(bggId) {
  const r = (typeof ratingsCache !== 'undefined') ? ratingsCache[bggId] : null;
  if (!r) return 0;
  let sum = 0, n = 0;
  for (const p in r) {
    const val = _ratingValue(r[p]);
    if (typeof val === 'number' && val > 0) { sum += val; n++; }
  }
  return n ? sum / n : 0;
}

function _computeBoardSouthVoteRanking(library) {
  const lib = library || _bsvLibrary;
  const owner = BSV_LIB_OWNER[lib];
  const votes = _bsvGetVotes(lib);
  const tally = {}; // bggId → { votes, score, voters: [{name, position}] }
  for (const voter in votes) {
    const list = votes[voter];
    if (!Array.isArray(list)) continue;
    list.forEach((bggId, idx) => {
      if (!Number.isFinite(bggId)) return;
      if (!tally[bggId]) tally[bggId] = { bggId, votes: 0, score: 0, voters: [] };
      tally[bggId].votes++;
      // score = Σ(1/position): a #2 placement weighs more than a #3, so it
      // breaks ties in favour of games people ranked higher in their lists.
      tally[bggId].score += 1 / (idx + 1);
      tally[bggId].voters.push({ name: voter, position: idx + 1 });
    });
  }
  // Sort, once vote counts are equal:
  //   1. priority score Σ(1/position) — this groups games by how high
  //      they sit in voters' lists. Two games each placed #4 by their
  //      voter both score 0.25, tie here, and so land next to each other.
  //   2. within the same position, the descriptive tie-break rules:
  //        a. games the library owner voted for come first
  //        b. highest average rating from this app's users
  //        c. highest BGG rating
  //   3. name, as the final stable order.
  return Object.values(tally).sort((a, b) => {
    if (b.votes !== a.votes) return b.votes - a.votes;

    // Position grouping — higher score (better placements) ranks first.
    if (b.score !== a.score) return b.score - a.score;

    // Same position → owner, then ratings.
    const aOwner = owner && a.voters.some(v => v.name === owner) ? 1 : 0;
    const bOwner = owner && b.voters.some(v => v.name === owner) ? 1 : 0;
    if (bOwner !== aOwner) return bOwner - aOwner;

    const aApp = _avgAppRating(a.bggId), bApp = _avgAppRating(b.bggId);
    if (bApp !== aApp) return bApp - aApp;

    const ga = _bsvFindGame(lib, a.bggId);
    const gb = _bsvFindGame(lib, b.bggId);
    const aBgg = Number(ga && ga.bggRating) || 0;
    const bBgg = Number(gb && gb.bggRating) || 0;
    if (bBgg !== aBgg) return bBgg - aBgg;

    return (ga ? ga.name : '').localeCompare(gb ? gb.name : '');
  });
}

function buildFavoritesHtml(playerName, isOwnProfile) {
  const favs = getPlayerFavorites(playerName);
  if (favs.length === 0 && !isOwnProfile) return '';

  let cards = '';
  for (let i = 0; i < 4; i++) {
    if (i < favs.length) {
      const game = findGameByBggId(favs[i]);
      const name = game ? game.name : 'Game #' + favs[i];
      const imgSrc = `images/${favs[i]}.jpg`;
      const removeBtn = isOwnProfile ? `<button class="fav-remove" data-fav-idx="${i}" title="Remove">&times;</button>` : '';
      cards += `<div class="fav-card" data-fav-bgg="${favs[i]}">
        ${removeBtn}
        <img src="${imgSrc}" alt="${name}" onerror="__imgFallback(this, ${favs[i]})">
        <div class="fav-card-name">${name}</div>
      </div>`;
    } else {
      cards += `<div class="fav-card fav-card-empty"><span>&#9733;</span></div>`;
    }
  }

  return `<div class="favorites-section">
    <div class="stats-section-title">Favorite Games</div>
    <div class="favorites-grid">${cards}</div>
  </div>`;
}

function wireFavoritesGrid(container, playerName, isOwnProfile) {
  container.querySelectorAll('.fav-card[data-fav-bgg]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.fav-remove')) return;
      const game = findGameByBggId(el.dataset.favBgg);
      if (game) openModal(game);
    });
  });
  container.querySelectorAll('.fav-remove').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const idx = Number(btn.dataset.favIdx);
      const favs = getPlayerFavorites(playerName).slice();
      favs.splice(idx, 1);
      await saveFavorites(playerName, favs);
      showStatsView(playerName);
    });
  });
  if (isOwnProfile) {
    container.querySelectorAll('.fav-card-empty').forEach(el => {
      el.addEventListener('click', () => openFavPicker(playerName));
    });
  }
}

function openFavPicker(playerName) {
  const existing = document.getElementById('fav-picker-overlay');
  if (existing) existing.remove();

  const currentFavs = getPlayerFavorites(playerName);

  // Build a comprehensive game list across EVERY known catalogue so favorites
  // aren't restricted to my own shelf. Sources, in priority order (later
  // entries overwrite earlier ones, picking up newer urlImage/name data):
  //   1. GAMES (Στιβ's hardcoded shelf)
  //   2. EXTRA_GAMES (BGStats-imported games)
  //   3. GIANNIS_GAMES (Φωτοπουλος's catalogue)
  //   4. LGEORGE_GAMES (LGeorge's catalogue)
  //   5. Any bggId that has play history but no metadata anywhere.
  // bggId === 0 is allowed through (the "Η γεωγραφία ειναι πολυ κουλ" game).
  const byId = new Map();
  const add = (g) => {
    if (!g || g.bggId == null) return;
    const existing = byId.get(g.bggId);
    const merged = {
      bggId: g.bggId,
      name: g.name || (existing && existing.name) || `Game #${g.bggId}`,
      urlImage: g.urlImage || (existing && existing.urlImage) || '',
    };
    byId.set(g.bggId, merged);
  };
  if (typeof GAMES !== 'undefined') GAMES.forEach(add);
  if (typeof EXTRA_GAMES !== 'undefined') Object.values(EXTRA_GAMES).forEach(add);
  if (typeof GIANNIS_GAMES !== 'undefined') Object.values(GIANNIS_GAMES).forEach(add);
  if (typeof LGEORGE_GAMES !== 'undefined') Object.values(LGEORGE_GAMES).forEach(add);
  for (const bggIdStr in PLAY_HISTORY) {
    const id = Number(bggIdStr);
    if (!byId.has(id)) byId.set(id, { bggId: id, name: `Game #${id}`, urlImage: '' });
  }
  const allGames = Array.from(byId.values()).sort((a, b) => a.name.localeCompare(b.name));

  const overlay = document.createElement('div');
  overlay.id = 'fav-picker-overlay';
  overlay.className = 'fav-picker-overlay';
  overlay.innerHTML = `
    <div class="fav-picker-panel">
      <div class="fav-picker-head">
        <div class="fav-picker-title">Add a Favorite</div>
        <button class="fav-picker-close" aria-label="Close">&times;</button>
      </div>
      <input type="text" class="fav-picker-search" id="fav-picker-search" placeholder="Search games..." autocomplete="off">
      <div class="fav-picker-list" id="fav-picker-list"></div>
    </div>`;
  document.body.appendChild(overlay);

  const listEl = overlay.querySelector('#fav-picker-list');
  const searchEl = overlay.querySelector('#fav-picker-search');

  const render = (q) => {
    const term = (q || '').trim().toLowerCase();
    const matches = allGames
      .filter(g => !term || g.name.toLowerCase().includes(term))
      .slice(0, 500);
    listEl.innerHTML = matches.map(g => {
      const already = currentFavs.includes(g.bggId);
      const imgSrc = `images/${g.bggId}.jpg`;
      // Local file → urlImage → generic placeholder. Same chain the BS
      // vote view uses so the picker is never visually empty.
      const urlAttr = (g.urlImage || '').replace(/'/g, "\\'");
      return `<div class="fav-picker-row${already ? ' already' : ''}" data-bgg="${g.bggId}">
        <img class="fav-picker-img" src="${imgSrc}" alt=""
             onerror="window.__favPickerImgFallback(this, '${urlAttr}')">
        <div class="fav-picker-name">${g.name}${already ? ' <span class="fav-picker-tag">already a favorite</span>' : ''}</div>
      </div>`;
    }).join('') || '<div class="fav-picker-empty">No games match.</div>';
    listEl.querySelectorAll('.fav-picker-row').forEach(row => {
      row.addEventListener('click', async () => {
        if (row.classList.contains('already')) { close(); return; }
        const bggId = Number(row.dataset.bgg);
        const favs = getPlayerFavorites(playerName).slice();
        if (favs.length >= 4) return;
        favs.push(bggId);
        await saveFavorites(playerName, favs);
        close();
        showStatsView(playerName, _viewingProfile ? 'visiting' : undefined);
      });
    });
  };

  const close = () => overlay.remove();
  overlay.querySelector('.fav-picker-close').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  searchEl.addEventListener('input', () => render(searchEl.value));
  render('');
  setTimeout(() => searchEl.focus(), 50);
}

renderShelf();

// On touch devices, set library viewport so full shelf fits on screen
if (_isTouchDevice()) {
  document.body.classList.add('mobile-library');
  _setViewport(VP_LIBRARY);
  requestAnimationFrame(_scrollToShelfCenter);
}

// Migrate old Latin player name in localStorage
const _sp = localStorage.getItem('bgl-player');
if (_sp && NAME_MAP[_sp]) localStorage.setItem('bgl-player', NAME_MAP[_sp]);

// Hard guard: if anything bypasses the CSS lock (legacy browser, rogue
// element extending past viewport, browser quirk, etc.), snap the page
// back to scrollX = 0 immediately. The library shelf doesn't use
// document-level horizontal scroll at all — it pans the visual viewport
// on touch and scrolls inside .shelf-wrapper on desktop — so this is
// safe to apply unconditionally.
(function _lockHorizontalScroll() {
  const snap = () => {
    if (window.scrollX !== 0) window.scrollTo(0, window.scrollY);
  };
  window.addEventListener('scroll', snap, { passive: true });
  // Also snap on resize, since resizing can momentarily shift scroll position.
  window.addEventListener('resize', snap, { passive: true });
})();

// Load ratings and favorites from Firebase, then show the right view
// ── User profiles (Firebase-backed display-name overrides) ──
// A logged-in player can rename how they appear everywhere. Stored at
// profiles/{originalCanonicalName} = { name, updatedAt } — a `photo` field is
// reserved here for a future per-profile picture. The rename is applied at
// startup the same way NAME_MAP is: it folds into NAME_MAP, rewrites play
// names and remaps the Firebase caches, so the new name shows up on every
// device. Inert (no behaviour change) until at least one profile is renamed.
let PROFILE_OVERRIDES = {};   // originalCanonicalName → chosen display name
let PROFILE_DATA = {};        // originalCanonicalName → { name, photo, … }
let DISPLAY_TO_CANON = {};    // display name → originalCanonicalName (for re-renames)
// Profiles live at the clean /profiles node once a Firebase rule permits it.
// Until then we fall back to a namespaced child of the already-writable
// gameImages node (loadGameImages ignores it — no .url). Reads merge both
// (primary wins); writes try /profiles first, then the fallback. This makes
// the migration seamless: add the /profiles rule and it upgrades on its own.
const PROFILE_STORE_PRIMARY = 'profiles';
const PROFILE_STORE_FALLBACK = 'gameImages/_bglProfiles';

async function _fetchProfileStore(path) {
  try {
    const res = await fetch(`${FIREBASE_DB}/${path}.json`);
    if (!res.ok) return null;
    const data = await res.json();
    return (data && typeof data === 'object') ? data : null;
  } catch (e) { return null; }
}

async function loadProfiles() {
  if (!FIREBASE_DB) return;
  const fallback = await _fetchProfileStore(PROFILE_STORE_FALLBACK);
  const primary = await _fetchProfileStore(PROFILE_STORE_PRIMARY);
  const data = Object.assign({}, fallback || {}, primary || {}); // primary wins
  for (const enc in data) {
    const entry = data[enc];
    if (!entry || typeof entry !== 'object') continue;
    const canon = decodeURIComponent(enc);
    PROFILE_DATA[canon] = entry;
    if (entry.name && typeof entry.name === 'string' && entry.name !== canon) {
      PROFILE_OVERRIDES[canon] = entry.name;
    }
  }
}

// Remap an object's player-name keys through NAME_MAP, merging collisions.
function _rekeyByNameMap(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  const out = {};
  for (const k in obj) {
    const nk = NAME_MAP[k] || k;
    const val = obj[k];
    if (!(nk in out)) { out[nk] = val; continue; }
    // Collision (e.g. an old name and a stale renamed key both mapping here).
    const cur = out[nk];
    if (Array.isArray(cur) || Array.isArray(val)) {
      // Lists (favorites, votes): keep the richer one so a stale empty key
      // can never clobber real data — order-independent.
      const a = Array.isArray(cur) ? cur : [];
      const b = Array.isArray(val) ? val : [];
      out[nk] = b.length > a.length ? b : a;
    } else if (cur && val && typeof cur === 'object' && typeof val === 'object') {
      Object.assign(cur, val);
    } else {
      out[nk] = val || cur;
    }
  }
  return out;
}

// Original canonical name behind a (possibly renamed) display name.
function _origCanon(name) { return DISPLAY_TO_CANON[name] || name; }

function _applyProfileOverrides() {
  if (!PROFILE_OVERRIDES || !Object.keys(PROFILE_OVERRIDES).length) return;
  // 1. Fold renames into NAME_MAP so every NAME_MAP[x]||x read resolves to the
  //    new name; record the reverse map and update identity-sensitive lists.
  for (const orig in PROFILE_OVERRIDES) {
    const disp = PROFILE_OVERRIDES[orig];
    for (const k in NAME_MAP) if (NAME_MAP[k] === orig) NAME_MAP[k] = disp;
    NAME_MAP[orig] = disp;
    DISPLAY_TO_CANON[disp] = orig;
    if (typeof ILIOUPOLI_MEMBERS !== 'undefined' && ILIOUPOLI_MEMBERS.has(orig)) {
      ILIOUPOLI_MEMBERS.delete(orig); ILIOUPOLI_MEMBERS.add(disp);
    }
    if (typeof OATHSWORN_VOTERS !== 'undefined') {
      const oi = OATHSWORN_VOTERS.indexOf(orig); if (oi >= 0) OATHSWORN_VOTERS[oi] = disp;
    }
    if (typeof BOARD_SOUTH_REGULARS !== 'undefined' && BOARD_SOUTH_REGULARS.has(orig)) {
      BOARD_SOUTH_REGULARS.delete(orig); BOARD_SOUTH_REGULARS.add(disp);
    }
  }
  // 2. Re-run the play-name rewrite for the freshly-added mappings.
  for (const bggId in PLAY_HISTORY)
    for (const play of PLAY_HISTORY[bggId])
      for (const s of play.sc) if (NAME_MAP[s.n]) s.n = NAME_MAP[s.n];
  // 3. Remap the Firebase caches keyed by player name.
  if (typeof favoritesCache === 'object') favoritesCache = _rekeyByNameMap(favoritesCache);
  if (typeof oathswornRanks === 'object') oathswornRanks = _rekeyByNameMap(oathswornRanks);
  if (typeof ratingsCache === 'object') for (const b in ratingsCache) ratingsCache[b] = _rekeyByNameMap(ratingsCache[b]);
  if (typeof boardSouthVotes === 'object') for (const lib in boardSouthVotes) boardSouthVotes[lib] = _rekeyByNameMap(boardSouthVotes[lib]);
  if (typeof gameNotesCache === 'object') for (const b in gameNotesCache) for (const id in gameNotesCache[b]) {
    const n = gameNotesCache[b][id];
    if (n && n.author && NAME_MAP[n.author]) n.author = NAME_MAP[n.author];
  }
  // 4. Migrate this device's login so the logged-in identity follows the rename.
  const raw = localStorage.getItem('bgl-player');
  if (raw) { const m = NAME_MAP[raw] || raw; if (m !== raw) localStorage.setItem('bgl-player', m); }
}

// Distinct player names currently in play history (post-remap).
function _knownPlayerNames() {
  const s = new Set();
  for (const bggId in PLAY_HISTORY)
    for (const play of PLAY_HISTORY[bggId])
      for (const sc of play.sc) if (sc && sc.n) s.add(sc.n);
  return s;
}

// Save the logged-in player's chosen display name, keyed by their ORIGINAL
// canonical name so repeated renames always rewrite the same identity.
async function _saveProfileName(newName) {
  newName = (newName || '').trim().replace(/\s+/g, ' ');
  const cur = localStorage.getItem('bgl-player');
  if (!cur) return { ok: false, err: 'Not logged in.' };
  if (!newName) return { ok: false, err: 'Name cannot be empty.' };
  if (newName.length > 40) return { ok: false, err: 'Name is too long (40 max).' };
  if (newName === cur) return { ok: false, err: 'That is already your name.' };
  const others = _knownPlayerNames(); others.delete(cur);
  if (others.has(newName)) return { ok: false, err: 'Another player already uses that name.' };
  if (!FIREBASE_DB) return { ok: false, err: 'No connection.' };
  const orig = _origCanon(cur) || (NAME_MAP[cur] || cur);
  const existing = PROFILE_DATA[orig] || {};
  const body = JSON.stringify({ ...existing, name: newName, updatedAt: Date.now() });
  const put = async (path) => {
    try {
      const res = await fetch(`${FIREBASE_DB}/${path}/${encodeURIComponent(orig)}.json`, { method: 'PUT', body });
      return !!(res && res.ok);
    } catch (e) { return false; }
  };
  // Prefer the clean /profiles node; fall back to the gameImages piggyback if
  // its rule isn't in place yet. fetch resolves even on HTTP errors, so we
  // check ok — otherwise we'd point this device at a name with no play data.
  let ok = await put(PROFILE_STORE_PRIMARY);
  if (!ok) ok = await put(PROFILE_STORE_FALLBACK);
  if (!ok) return { ok: false, err: 'Save failed — try again.' };
  PROFILE_DATA[orig] = { ...existing, name: newName };
  localStorage.setItem('bgl-player', newName);
  return { ok: true };
}

Promise.all([loadAllRatings(), loadAllFavorites(), loadImportedGames(), loadImportedPlays(), loadGameImages(), loadBoardSouthVotes(), loadOathswornRanks(), loadAllNotes(), loadProfiles()]).then(() => {
  _applyProfileOverrides();
  _fixGiorgosIdentities();
  if (typeof _updateBoardSouthBtnVisibility === 'function') _updateBoardSouthBtnVisibility();
  const savedPlayer = localStorage.getItem('bgl-player');
  // Self-heal: a login can only ever be a player who exists in the play
  // history. If localStorage points at a name with no plays (e.g. a rename
  // that failed to persist), recover by sending them back to the picker
  // instead of rendering an empty zero-games profile.
  const isOrphanLogin = savedPlayer && !_knownPlayerNames().has(savedPlayer);
  if (savedPlayer && !isOrphanLogin) {
    // The boot-to-profile CSS hook already hid the library shell on first
    // paint; drop the class now so subsequent navigation works normally.
    document.documentElement.classList.remove('boot-to-profile');
    showStatsView(savedPlayer);
  } else {
    if (isOrphanLogin) localStorage.removeItem('bgl-player');
    document.documentElement.classList.remove('boot-to-profile');
    openPicker();
  }
});

// ── JSON Import ──
// ── BGStats Play File Importer ──
window.initImporter = function(){
  const dropZone  = document.getElementById('importDropZone');
  const fileInput = document.getElementById('importFileInput');
  const result    = document.getElementById('importResult');
  const resTitle  = document.getElementById('importResultTitle');
  const resLines  = document.getElementById('importResultLines');
  const imgDls    = document.getElementById('importImgDownloads');
  if(!dropZone || !fileInput) return;

  function showResult(type, title, lines){
    // Re-query by id so this still works after a view re-render rebuilds the
    // import panel (the closure-captured elements would otherwise be stale).
    const r = document.getElementById('importResult');
    const rt = document.getElementById('importResultTitle');
    const rl = document.getElementById('importResultLines');
    const ri = document.getElementById('importImgDownloads');
    if(!r || !rt || !rl) return;
    r.className = 'import-result ' + type;
    r.style.display = 'block';
    rt.textContent = title;
    rl.innerHTML = lines.filter(Boolean).join('<br>');
    if(ri) ri.innerHTML = '';
  }

  async function fetchDescription(bggId){
    try{
      const res = await fetch(`https://boardgamegeek.com/xmlapi2/thing?id=${bggId}`);
      const txt = await res.text();
      const parser = new DOMParser();
      const xml = parser.parseFromString(txt, 'text/xml');
      const desc = xml.querySelector('description');
      if(!desc) return '';
      // decode HTML entities
      const ta = document.createElement('textarea');
      ta.innerHTML = desc.textContent;
      return ta.value.replace(/&#10;/g,'').trim().slice(0,600) + '…';
    } catch(e){ return ''; }
  }

  async function processImport(file){
    if(!file || !(/\.(json|bgsplay)$/i).test(file.name)){
      showResult('error','Invalid file',['Please select a .json or .bgsplay file exported from BGStats.']);
      return;
    }

    showResult('info','Reading file…',['Please wait…']);

    let data;
    try{
      const text = await file.text();
      data = JSON.parse(text);
    } catch(_){
      showResult('error','Parse error',['The file is not valid JSON.']);
      return;
    }

    // Validate it's a BGStats play file
    if(!data.plays || !data.games || !data.players){
      showResult('error','Wrong format',['This doesn\'t look like a BGStats Play export. Make sure you export using Share → Play File from BGStats.']);
      return;
    }

    // Build lookup maps from the imported file
    const importedGamesById  = {};  // id → game object
    const importedPlayersById = {}; // id → player object
    const importedLocationsById = {}; // id → location object
    data.games.forEach(g   => importedGamesById[g.id]   = g);
    data.players.forEach(p => importedPlayersById[p.id] = p);
    if (Array.isArray(data.locations)) {
      data.locations.forEach(l => importedLocationsById[l.id] = l);
    }

    // ── 1. Merge players ──
    // A player is "new" only if their mapped name doesn't already appear in PLAY_HISTORY
    const existingPlayerNames = new Set();
    for (const id in PLAY_HISTORY) {
      for (const play of PLAY_HISTORY[id]) {
        for (const s of play.sc) existingPlayerNames.add(s.n);
      }
    }
    let newPlayers = 0;
    data.players.forEach(p => {
      const mapped = NAME_MAP[p.name] || p.name;
      if(existingPlayerNames.has(mapped)) return;
      existingPlayerNames.add(mapped);
      newPlayers++;
    });

    // ── 2. Merge games → EXTRA_GAMES + PLAY_HISTORY images ──
    const existingBggIds = new Set(
      (window.GAMES || []).map(g => g.bggId).concat(
       Object.values(EXTRA_GAMES).map(g => g.bggId))
    );

    let newGames = 0;
    const descFetches = [];
    const gamePersists = [];

    data.games.forEach(g => {
      // Capture urlImage for ALL games (even already-known ones) so hardcoded
      // games can pick up covers from BGStats imports.
      const incomingUrl = g.urlImage || g.urlThumb || null;
      if (incomingUrl) {
        const existingGame = findGameByBggId(g.bggId);
        if (existingGame && !existingGame.urlImage) {
          existingGame.urlImage = incomingUrl;
          gamePersists.push(persistGameImage(g.bggId, incomingUrl));
        }
      }
      if(existingBggIds.has(g.bggId)) return;
      existingBggIds.add(g.bggId);
      newGames++;

      const entry = {
        id: 'imported_' + g.bggId,
        name: g.bggName || g.name,
        bggId: g.bggId,
        year: g.bggYear || null,
        designer: g.designers || '',
        players: (g.minPlayerCount && g.maxPlayerCount)
          ? (g.minPlayerCount === g.maxPlayerCount ? String(g.minPlayerCount) : `${g.minPlayerCount}-${g.maxPlayerCount}`)
          : '',
        playTime: (g.minPlayTime && g.maxPlayTime)
          ? (g.minPlayTime === g.maxPlayTime ? `${g.minPlayTime} min` : `${g.minPlayTime}-${g.maxPlayTime} min`)
          : '',
        categories: [],
        mechanics: [],
        description: '',
        bggRating: g.rating ? (g.rating / 10).toFixed(1) : null,
        urlImage: g.urlImage || g.urlThumb || null,
        imported: true,
      };

      // Queue description fetch
      descFetches.push(
        fetchDescription(g.bggId).then(desc => { entry.description = desc; })
      );

      EXTRA_GAMES[entry.bggId] = entry;
      gamePersists.push(persistImportedGame(entry));
      if (entry.urlImage) gamePersists.push(persistGameImage(entry.bggId, entry.urlImage));
    });

    // ── 3. Merge plays → PLAY_HISTORY ──
    let newPlays = 0, updatedPlays = 0, skipped = 0;
    const playPersists = [];

    data.plays.forEach(play => {
      const game = importedGamesById[play.gameRefId];
      if(!game || !game.bggId) return;
      const bggId = game.bggId;

      const fullStamp = play.playDate || play.entryDate || '';
      const dateStr = fullStamp.slice(0,10);
      // Preserve the full timestamp so plays on the same calendar day keep
      // their actual order through the leaderboard / per-play Elo replay.
      const tStamp = (fullStamp.length > 10 && fullStamp !== dateStr) ? fullStamp : null;

      const sc = (play.playerScores || []).map(ps => {
        const player = importedPlayersById[ps.playerRefId];
        let rawName = player ? player.name : ('Player ' + ps.playerRefId);
        const mappedName = NAME_MAP[rawName] || rawName;
        return {
          n: mappedName,
          s: ps.score !== null && ps.score !== undefined ? String(ps.score) : '',
          w: !!ps.winner,
          ...(ps.role ? {r: ps.role} : {}),
        };
      });

      const persistedEntry = { bggId, date: dateStr, sc };
      if(tStamp) persistedEntry.t = tStamp;
      if(play.durationMin) persistedEntry.d = play.durationMin;
      if(play.board) persistedEntry.b = play.board;
      const locObj = play.locationRefId ? importedLocationsById[play.locationRefId] : null;
      const locName = locObj && locObj.name ? locObj.name : '';
      if (locName) persistedEntry.l = LOCATION_MAP[locName] || locName;

      const alreadyImported = !!importedPlaysCache[play.uuid];
      _mergePlayIntoHistory(play.uuid, persistedEntry);
      playPersists.push(persistImportedPlay(play.uuid, persistedEntry));
      if(alreadyImported) updatedPlays++; else newPlays++;
    });

    await Promise.all(descFetches);
    await Promise.all(gamePersists);
    await Promise.all(playPersists);

    // Build the result message.
    const nothingNew = (newPlays === 0 && updatedPlays === 0 && newGames === 0 && newPlayers === 0);
    const resType  = nothingNew ? 'info' : 'success';
    const resTitle = nothingNew ? 'Nothing new' : 'Import successful ✓';
    const resLines = nothingNew
      ? ['All entries in this file already exist.', skipped ? `${skipped} duplicate(s) skipped.` : '']
      : [
          newPlays     ? `+${newPlays} new play${newPlays!==1?'s':''}` : '',
          updatedPlays ? `✏️ ${updatedPlays} play${updatedPlays!==1?'s':''} updated` : '',
          newGames     ? `+${newGames} new game${newGames!==1?'s':''}` : '',
          newPlayers   ? `+${newPlayers} new player${newPlayers!==1?'s':''}` : '',
          skipped      ? `${skipped} duplicate${skipped!==1?'s':''} skipped` : '',
        ];

    // Refresh every open view so updated plays — including changed locations —
    // appear immediately, instead of only after a reload/navigation. The
    // profile (where the importer lives) is re-rendered too; the result panel
    // is re-shown afterwards (showResult re-queries by id) and scrolled to.
    const isOpen = (id) => { const el = document.getElementById(id); return el && el.classList.contains('open'); };
    const player = (typeof localStorage !== 'undefined') ? localStorage.getItem('bgl-player') : null;
    try {
      if (isOpen('stats-view') && player && typeof showStatsView === 'function') {
        showStatsView((typeof _viewingProfile !== 'undefined' && _viewingProfile) || player,
                      (typeof _viewingProfile !== 'undefined' && _viewingProfile) ? 'visiting' : undefined);
      }
      if (isOpen('games-view') && typeof showGamesView === 'function') showGamesView();
      if (isOpen('challenges-view') && player && typeof showChallengesView === 'function') showChallengesView(player);
      if (isOpen('leaderboard-view') && typeof showLeaderboardView === 'function') showLeaderboardView();
      if (isOpen('boardsouth-view') && typeof showBoardSouthView === 'function') showBoardSouthView();
    } catch (_) {}
    if (typeof _updateBoardSouthBtnVisibility === 'function') { try { _updateBoardSouthBtnVisibility(); } catch (_) {} }

    showResult(resType, resTitle, resLines);
    const rEl = document.getElementById('importResult');
    if (rEl) rEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const fi = document.getElementById('importFileInput');
    if (fi) fi.value = '';
  }

  fileInput.addEventListener('change', e => processImport(e.target.files[0]));
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    processImport(e.dataTransfer.files[0]);
  });
};

</script>
