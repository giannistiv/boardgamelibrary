        </div>
        <div class="h2h-meta">${decisive} head-to-head play${decisive !== 1 ? 's' : ''}${streakLine}${lastDate ? ` · last: ${lastResult} on ${fmtDate(lastDate)}` : ''}</div>
      </div>`;
    }
  }

  // Build favorites section
  const favoritesHtml = buildFavoritesHtml(playerName, isOwnProfile);

  // Achievements moved to their own dedicated tab (#achievements-view).
  // Profile no longer renders the grid.

  // Build day/location charts for this player
  const playerDays = {};
  const playerLocs = {};
  for (const p of recentPlays) {
    const [y, m, d] = p.date.split('-').map(Number);
    const dow = new Date(y, m - 1, d).getDay();
    const dayName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dow];
    playerDays[dayName] = (playerDays[dayName] || 0) + 1;
    const loc = p.location || '';
    if (loc) playerLocs[loc] = (playerLocs[loc] || 0) + 1;
  }
  const chartsHtml = buildChartsHtml(playerDays, playerLocs, totalPlays);

  const container = document.getElementById('stats-view');
  container.innerHTML = `
    ${backBtnHtml}
    <div class="stats-header">
      ${isOwnProfile ? `<button class="profile-cog" id="btn-edit-name" title="Profile settings" aria-label="Profile settings">&#9881;</button>` : ''}
      <div class="stats-player-name">${playerName}</div>
      <div class="stats-player-sub">${isOwnProfile ? 'Your Profile' : 'Player Profile'}</div>
      ${isOwnProfile ? `<div class="profile-edit-form" id="profile-edit-form">
        <div class="profile-edit-label">Display name</div>
        <input type="text" id="profile-name-input" class="profile-name-input" maxlength="40" autocomplete="off" value="${playerName.replace(/"/g, '&quot;')}">
        <div class="profile-edit-actions">
          <button class="profile-edit-save" id="profile-name-save">Save</button>
          <button class="profile-edit-cancel" id="profile-name-cancel">Cancel</button>
        </div>
        <div class="profile-edit-err" id="profile-name-err"></div>
      </div>` : ''}
      ${_bggCollectionUrl(playerName)
        ? `<a class="stats-bgg-btn" href="${_bggCollectionUrl(playerName)}" target="_blank" rel="noopener">
             View collection on BGG ↗
           </a>`
        : ''}
    </div>

    ${buildWrappedBanner(playerName)}

    ${favoritesHtml}

    ${h2hHtml}

    <div class="stats-grid">
      <div class="stats-card">
        <div class="stats-card-val">${totalPlays}</div>
        <div class="stats-card-label">Total Plays</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-val">${totalWins}</div>
        <div class="stats-card-label">Total Wins</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-val" style="color:${wrColor(winRate)}">${winRate}%</div>
        <div class="stats-card-label">Win Rate</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-val">${coopWins}<span style="font-size:0.55em;opacity:0.55">/${coopPlays.length}</span></div>
        <div class="stats-card-label">Coop Wins</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-val">${uniqueGames}</div>
        <div class="stats-card-label">Unique Games</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-val">${uniquePlayers}</div>
        <div class="stats-card-label">Different Players</div>
      </div>
    </div>

    ${buildPlayHeatmapHtml(playerName)}

    <div class="stats-section">
      <div class="stats-section-title">Latest Plays</div>
      ${latestPlays.length > 0
        ? latestPlays.map(latestPlayRowHtml).join('')
        : '<div class="stats-game-detail" style="opacity:0.55;padding:0.4rem 0">No plays recorded yet.</div>'}
      ${recentPlays.length > 0 ? `<button class="lpm-view-all-btn" data-lpm-open="${playerName.replace(/"/g,'&quot;')}">View all ${recentPlays.length} plays →</button>` : ''}
    </div>

    ${bestWR.length > 0 ? `<div class="stats-section">
      <div class="stats-section-title">Best Win Rate in PvP (3+ plays)</div>
      ${bestWR.map(gameRowHtml).join('')}
    </div>` : ''}

    ${chartsHtml}

    ${isOwnProfile && recommendations.length > 0 ? `<div class="stats-section">
      <div class="stats-section-title">Recommended for You</div>
      <div class="stats-player-sub" style="margin:-0.3rem 0 0.6rem">Top-rated games from the shelf you haven't tried yet</div>
      ${recommendations.map(g => {
        const imgSrc = g.bggId >= 0 ? `images/${g.bggId}.jpg` : '';
        return `<div class="stats-rec-row" data-bgg-id="${g.bggId}">
          ${imgSrc ? `<img class="stats-game-img" src="${imgSrc}" alt="" onerror="__imgFallback(this, ${g.bggId})">` : ''}
          <div class="stats-game-info">
            <div class="stats-game-name">${g.name}</div>
            <div class="stats-game-detail">${g.players} players &middot; ${g.playTime} &middot; ${g.complexity}/5 weight</div>
          </div>
          <div class="stats-game-wr" style="color:${wrColor(Math.round((g.bggRating/10)*100))}">${g.bggRating}</div>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${_origCanon(playerName) === 'Στιβ' ? `<div class="qr-section">
      <div class="stats-section-title" style="border:none;text-align:center">Share This Library</div>
      <div class="qr-canvas"><img id="qr-img" width="150" height="150" alt="QR Code" style="border-radius:8px"></div>
      <div class="qr-label">Scan to open on your phone</div>
    </div>` : ''}

    <!-- ── JSON Import (Στιβ only) ── -->
  ${_origCanon(playerName) === 'Στιβ' ? (() => {
    // Find the most recent play date across PLAY_HISTORY so the user can
    // tell from which day onwards they still need to upload.
    let latest = '';
    for (const bggId in PLAY_HISTORY) {
      for (const p of PLAY_HISTORY[bggId]) {
        if (p && p.date && p.date > latest) latest = p.date;
      }
    }
    const latestLabel = latest ? fmtDate(latest) : null;
    const sinceLine = latestLabel
      ? `<div class="import-last-play">Latest uploaded play: <b>${latestLabel}</b></div>`
      : '';
    return `<div class="import-section" id="importSection">
      <div class="import-section-title">📥 Import BGStats Play File</div>
      ${sinceLine}
      <div class="import-drop-zone" id="importDropZone">
        <input type="file" id="importFileInput" accept=".json,.bgsplay">
        <div class="import-drop-icon">📂</div>
        <div class="import-drop-label">Drop your BGStats Play export here</div>
        <div class="import-drop-sub">or click to browse — new plays, players & games will be merged</div>
      </div>
      <div class="import-result" id="importResult">
        <div class="import-result-title" id="importResultTitle"></div>
        <div class="import-result-lines" id="importResultLines"></div>
      </div>
    </div>`;
  })() : ''}

    ${isOwnProfile ? '<button class="change-profile-btn" id="btn-change-profile">Change Profile</button>' : ''}
  `;

  // Wire up importer for Στιβ
  if (_origCanon(playerName) === 'Στιβ' && typeof window.initImporter === 'function') {
    window.initImporter();
  }

  // Make game rows clickable
  container.querySelectorAll('[data-bgg-id]').forEach(el => {
    el.addEventListener('click', () => {
      const game = findGameByBggId(el.dataset.bggId);
      if (game) openModal(game);
    });
  });

  // Wire favorites grid
  wireFavoritesGrid(container, playerName, isOwnProfile);

  // Wire "View all plays" button → opens the full-log modal.
  const viewAllBtn = container.querySelector('[data-lpm-open]');
  if (viewAllBtn) {
    viewAllBtn.addEventListener('click', () => {
      _openLatestPlaysModal(viewAllBtn.dataset.lpmOpen, recentPlays);
    });
  }

  // Refresh favorites from Firebase for cross-device sync. Favorites are
  // stored under the player's ORIGINAL canonical name, so a renamed player
  // must read by that key — otherwise this fetch returns nothing and wipes
  // their favorites.
  if (FIREBASE_DB) {
    fetch(`${FIREBASE_DB}/favorites/${encodeURIComponent(_origCanon(playerName))}.json`)
      .then(r => r.json())
      .then(data => {
        if (!data) data = [];
        if (!Array.isArray(data)) return;
        const current = getPlayerFavorites(playerName);
        if (JSON.stringify(current) === JSON.stringify(data)) return;
        favoritesCache[playerName] = data;
        _saveFavoritesToLocal();
        const section = container.querySelector('.favorites-section');
        const newHtml = buildFavoritesHtml(playerName, isOwnProfile);
        if (section) {
          section.outerHTML = newHtml;
        } else if (newHtml) {
          const header = container.querySelector('.stats-header');
          if (header) header.insertAdjacentHTML('afterend', newHtml);
        }
        wireFavoritesGrid(container, playerName, isOwnProfile);
      })
      .catch(() => {});
  }

  // Change profile button
  const changeBtn = document.getElementById('btn-change-profile');
  if (changeBtn) {
    changeBtn.addEventListener('click', () => {
      localStorage.removeItem('bgl-player');
      if (typeof _updateBoardSouthBtnVisibility === 'function') _updateBoardSouthBtnVisibility();
      openPicker();
    });
  }

  // Year-in-Review "Wrapped" banner → opens the story modal.
  const wrappedBanner = container.querySelector('#wrapped-banner');
  if (wrappedBanner) {
    wrappedBanner.addEventListener('click', () => openWrappedModal(playerName, isOwnProfile));
  }

  // Play heatmap (year nav + tap-a-day).
  _wireHeatmap(playerName);

  // Edit-name (own profile only): reveal an inline editor, save to Firebase,
  // then reload so the rename propagates through the startup machinery.
  const editBtn = document.getElementById('btn-edit-name');
  const editForm = document.getElementById('profile-edit-form');
  if (editBtn && editForm) {
    const input = document.getElementById('profile-name-input');
    const errEl = document.getElementById('profile-name-err');
    const close = () => { editForm.classList.remove('open'); errEl.textContent = ''; input.value = playerName; };
    editBtn.addEventListener('click', () => {
      const opening = !editForm.classList.contains('open');
      editForm.classList.toggle('open', opening);
      if (opening) { input.focus(); input.select(); }
    });
    document.getElementById('profile-name-cancel').addEventListener('click', close);
    const doSave = async () => {
      const saveBtn = document.getElementById('profile-name-save');
      saveBtn.disabled = true; errEl.style.color = ''; errEl.textContent = 'Saving…';
      const r = await _saveProfileName(input.value);
      if (r.ok) { window.location.reload(); }
      else { errEl.textContent = r.err; saveBtn.disabled = false; }
    };
    document.getElementById('profile-name-save').addEventListener('click', doSave);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); doSave(); }
      else if (e.key === 'Escape') close();
    });
  }

  // Generate QR code via API
  const qrImg = document.getElementById('qr-img');
  if (qrImg) {
    const url = encodeURIComponent(window.location.href.split('?')[0].split('#')[0]);
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${url}`;
  }
}

// ── Rating System (Firebase Realtime Database) ──
// PASTE YOUR FIREBASE REALTIME DATABASE URL BELOW:
const FIREBASE_DB = 'https://boardgamelibrary0-default-rtdb.europe-west1.firebasedatabase.app';

// In-memory cache of all ratings: { bggId: { playerName: {value, updatedAt} } }
// Legacy shape was { bggId: { playerName: number } } — migrated on load.
let ratingsCache = {};
let ratingsCacheReady = false;

async function loadAllRatings() {
  if (!FIREBASE_DB) { ratingsCacheReady = true; return; }
  try {
    const res = await fetch(`${FIREBASE_DB}/ratings.json`);
    const data = await res.json();
    ratingsCache = data || {};
    const migrations = [];
    for (const bggId in ratingsCache) {
      for (const player in ratingsCache[bggId]) {
        const v = ratingsCache[bggId][player];
        if (typeof v === 'number') {
          const obj = { value: v, updatedAt: 0 };
          ratingsCache[bggId][player] = obj;
          migrations.push(
            fetch(`${FIREBASE_DB}/ratings/${bggId}/${encodeURIComponent(player)}.json`, {
              method: 'PUT',
              body: JSON.stringify(obj)
            }).catch(() => {})
          );
        }
      }
    }
    if (migrations.length) await Promise.all(migrations);
    ratingsCacheReady = true;
  } catch (e) {
    console.warn('Failed to load ratings from Firebase:', e);
    ratingsCacheReady = true;
  }
}

// Re-fetch all ratings from Firebase. Returns true when the fresh data
// differs from the in-memory cache (caller decides whether to re-render).
// Unlike loadAllRatings this never writes migrations back — by now every
// stored rating is already in {value, updatedAt} shape.
async function refreshRatings() {
  if (!FIREBASE_DB) return false;
  try {
    const res = await fetch(`${FIREBASE_DB}/ratings.json`);
    const data = await res.json();
    if (!data) return false;
    for (const bggId in data) {
      for (const player in data[bggId]) {
        const v = data[bggId][player];
        if (typeof v === 'number') data[bggId][player] = { value: v, updatedAt: 0 };
      }
    }
    if (JSON.stringify(data) === JSON.stringify(ratingsCache)) return false;
    ratingsCache = data;
    return true;
  } catch (_) {
    return false;
  }
}

async function saveRating(playerName, bggId, rating) {
  if (!ratingsCache[bggId]) ratingsCache[bggId] = {};
  if (rating === 0) {
    delete ratingsCache[bggId][playerName];
    if (Object.keys(ratingsCache[bggId]).length === 0) delete ratingsCache[bggId];
  } else {
    ratingsCache[bggId][playerName] = { value: rating, updatedAt: Date.now() };
  }

  if (!FIREBASE_DB) return;
  // Persist under the original canonical name so a renamed player's ratings
  // stay keyed consistently (matching how they're loaded).
  const key = encodeURIComponent(_origCanon(playerName));
  try {
    if (rating === 0) {
      await fetch(`${FIREBASE_DB}/ratings/${bggId}/${key}.json`, { method: 'DELETE' });
    } else {
      await fetch(`${FIREBASE_DB}/ratings/${bggId}/${key}.json`, {
        method: 'PUT',
        body: JSON.stringify(ratingsCache[bggId][playerName])
      });
    }
  } catch (e) {
    console.warn('Failed to save rating to Firebase:', e);
  }
}

function _ratingValue(r){ return typeof r === 'number' ? r : (r && r.value) || 0; }

// ── Per-game shared notes ──
// Stored in Firebase at /gameNotes/{bggId}/{noteId} = {text, author, createdAt, updatedAt}.
// Loaded once on startup so every browser sees the same shared notes.
let gameNotesCache = {}; // bggId -> { noteId: {text, author, createdAt, updatedAt} }

async function loadAllNotes() {
  if (!FIREBASE_DB) return;
  try {
    const res = await fetch(`${FIREBASE_DB}/gameNotes.json`);
    const data = await res.json();
    // A denied read (locked Firebase rules) returns {error: "..."} — don't let
    // that object pollute the cache; fall back to empty.
    gameNotesCache = (data && typeof data === 'object' && !data.error) ? data : {};
  } catch (e) {
    console.warn('Failed to load notes from Firebase:', e);
  }
}

async function saveNote(bggId, noteId, obj) {
  if (!gameNotesCache[bggId]) gameNotesCache[bggId] = {};
  gameNotesCache[bggId][noteId] = obj;
  if (!FIREBASE_DB) return;
  try {
    await fetch(`${FIREBASE_DB}/gameNotes/${bggId}/${encodeURIComponent(noteId)}.json`, {
      method: 'PUT',
      body: JSON.stringify(obj)
    });
  } catch (e) {
    console.warn('Failed to save note to Firebase:', e);
  }
}

async function deleteNote(bggId, noteId) {
  if (gameNotesCache[bggId]) {
    delete gameNotesCache[bggId][noteId];
    if (Object.keys(gameNotesCache[bggId]).length === 0) delete gameNotesCache[bggId];
  }
  if (!FIREBASE_DB) return;
  try {
    await fetch(`${FIREBASE_DB}/gameNotes/${bggId}/${encodeURIComponent(noteId)}.json`, { method: 'DELETE' });
  } catch (e) {
    console.warn('Failed to delete note from Firebase:', e);
  }
}

// ── Imported plays persistence ──
// Stored in Firebase at /importedPlays/{uuid} = {bggId, date, sc, d?, b?}
// Merged into the in-memory PLAY_HISTORY on startup so new browsers see them.
let importedPlaysCache = {}; // uuid -> play entry (includes bggId)

function _mergePlayIntoHistory(uuid, p) {
  if (!p || !p.bggId || !p.date || !Array.isArray(p.sc)) return;
  const bggId = p.bggId;
  if (!PLAY_HISTORY[bggId]) PLAY_HISTORY[bggId] = [];
  for (const s of p.sc) {
    if (s && s.n && NAME_MAP[s.n]) s.n = NAME_MAP[s.n];
  }
  _fixGiorgosInPlay(p);
  if (p.l && LOCATION_MAP[p.l]) p.l = LOCATION_MAP[p.l];
  const entry = { date: p.date, sc: p.sc, _uuid: uuid };
  if (p.t) entry.t = p.t;
  if (p.d) entry.d = p.d;
  if (p.b) entry.b = p.b;
  if (p.l) entry.l = p.l;

  const newNames = new Set(p.sc.map(s => s.n));
  const isHardcodedDup = (e) => {
    if (e._uuid) return false;
    if (e.date !== p.date) return false;
    if (e.sc.length !== p.sc.length) return false;
    let overlap = 0;
    for (const s of e.sc) if (newNames.has(s.n)) overlap++;
    return overlap >= Math.max(1, e.sc.length - 1);
  };

  // 1. Prefer matching the existing entry by uuid across all bggIds
  let placed = false;
  for (const existingBggId in PLAY_HISTORY) {
    const arr = PLAY_HISTORY[existingBggId];
    const uuidIdx = arr.findIndex(e => e._uuid === uuid);
    if (uuidIdx !== -1) {
      if (existingBggId == bggId) {
        arr[uuidIdx] = entry;
      } else {
        arr.splice(uuidIdx, 1);
        PLAY_HISTORY[bggId].push(entry);
        PLAY_HISTORY[bggId].sort((a,b) => b.date.localeCompare(a.date));
      }
      placed = true;
      break;
    }
  }

  // 2. Fall back to hardcoded dedup: same date + same player count + ≥ N-1
  // players overlap (set-based, order-independent) → replace.
  if (!placed) {
    const idx = PLAY_HISTORY[bggId].findIndex(isHardcodedDup);
    if (idx !== -1) {
      PLAY_HISTORY[bggId][idx] = entry;
    } else {
      PLAY_HISTORY[bggId].push(entry);
      PLAY_HISTORY[bggId].sort((a,b) => b.date.localeCompare(a.date));
    }
    return;
  }

  // 3. After uuid match placed the entry, also clean up any leftover
  // hardcoded duplicates of the same play (e.g. old PLAY_HISTORY entry
  // that was imported separately before — now that it has a uuid, its
  // hardcoded twin should go away).
  PLAY_HISTORY[bggId] = PLAY_HISTORY[bggId].filter(e =>
    e._uuid === uuid || !isHardcodedDup(e)
  );
}

async function loadImportedPlays() {
  if (!FIREBASE_DB) return;

    const res = await fetch(`${FIREBASE_DB}/importedPlays.json`);

    for (const uuid in importedPlaysCache) {
      _mergePlayIntoHistory(uuid, importedPlaysCache[uuid]);

function getPlayerRating(playerName, bggId) {
  return _ratingValue(ratingsCache[bggId] && ratingsCache[bggId][playerName]);
}

function getCommunityRating(bggId) {
  const gameRatings = ratingsCache[bggId];
  if (!gameRatings) return null;
  const values = Object.values(gameRatings).map(_ratingValue).filter(v => v > 0);
  if (values.length === 0) return null;
  const avg = values.reduce((a, b) => a + b, 0) / values.length;
  return { avg: Math.round(avg * 10) / 10, count: values.length };
}

function buildStarRatingHtml(bggId) {
  const player = localStorage.getItem('bgl-player');
  const current = player ? getPlayerRating(player, bggId) : 0;

  let html = '<div class="star-rating-section">';

  // Player rating
  if (player) {
    html += `<div class="star-rating-label">${current ? 'Your Rating' : 'Rate this game'}</div>`;
    html += `<div style="display:flex;align-items:center">`;
    html += `<div class="star-rating-row" id="star-row" data-bgg="${bggId}" data-current="${current}">`;
    for (let i = 1; i <= 10; i++) {
      html += `<span class="star${i <= current ? ' filled' : ''}" data-val="${i}">&#9733;</span>`;
    }
    html += `</div>`;
    if (current) html += `<span class="star-rating-val">${current}/10</span>`;
    if (current) html += `<button class="star-rating-clear" data-bgg="${bggId}">clear</button>`;
    html += `</div>`;
  }

  html += '</div>';
  return html;
}

function wireStarRating() {
  const row = document.getElementById('star-row');
  if (!row) return;
  const stars = row.querySelectorAll('.star');
  const bggId = Number(row.dataset.bgg);
  const player = localStorage.getItem('bgl-player');

  // Hover effect
  stars.forEach(star => {
    star.addEventListener('mouseenter', () => {
      const val = Number(star.dataset.val);
      stars.forEach(s => {
        s.classList.toggle('hovered', Number(s.dataset.val) <= val);
      });
    });
  });
  row.addEventListener('mouseleave', () => {
    stars.forEach(s => s.classList.remove('hovered'));
  });

  // Click to rate
  stars.forEach(star => {
    star.addEventListener('click', async () => {
      const val = Number(star.dataset.val);
      if (player) {
        await saveRating(player, bggId, val);
        const section = row.closest('.star-rating-section');
        if (section) {
          section.outerHTML = buildStarRatingHtml(bggId);
          wireStarRating();
        }
      }
    });
  });

  // Clear button
  const clearBtn = document.querySelector('.star-rating-clear');
  if (clearBtn) {
    clearBtn.addEventListener('click', async () => {
      if (player) {
        await saveRating(player, Number(clearBtn.dataset.bgg), 0);
        const section = clearBtn.closest('.star-rating-section');
        if (section) {
          section.outerHTML = buildStarRatingHtml(Number(clearBtn.dataset.bgg));
          wireStarRating();
        }
      }
    });
  }
}

// ── Game Notes (shared, per-game) ──
function _notesEsc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function buildNotesHtml(bggId) {
  const player = localStorage.getItem('bgl-player');
  const obj = gameNotesCache[bggId] || {};
  const notes = Object.keys(obj)
    .map(id => ({ id, ...obj[id] }))
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); // oldest first

  const fmt = (ts) => {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d)) return '';
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  };

  let html = `<div class="notes-section" data-bgg="${bggId}">
    <div class="notes-header">
      <span class="notes-title">&#128221; Notes</span>
      <span class="notes-sub">shared &middot; visible to everyone</span>
    </div>`;

  if (notes.length === 0) {
    html += `<div class="notes-empty">No notes yet${player ? ' — jot down a rule you forget or a tip for next time.' : '.'}</div>`;
  } else {
    html += `<div class="notes-list">`;
    for (const n of notes) {
      // Anyone with a name picked can edit/delete any note (shared notepad).
      const edited = (n.updatedAt && n.createdAt && n.updatedAt !== n.createdAt) ? ' &middot; edited' : '';
      html += `<div class="note-entry" data-id="${_notesEsc(n.id)}">
        <div class="note-text">${_notesEsc(n.text || '')}</div>
        <div class="note-meta">
          <span class="note-author">${_notesEsc(n.author || 'Someone')}</span>
          <span class="note-date">${fmt(n.createdAt)}${edited}</span>
          ${player ? `<span class="note-actions">
            <button class="note-btn note-edit" data-id="${_notesEsc(n.id)}">edit</button>
            <button class="note-btn note-del" data-id="${_notesEsc(n.id)}">delete</button>
          </span>` : ''}
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  if (player) {
    html += `<div class="note-add-wrap">
      <textarea class="note-textarea" id="note-input" rows="2" placeholder="Add a note… (rules you forget, house rules, tips for next time)"></textarea>
      <button class="note-add-btn" id="note-add-btn">Add note</button>
    </div>`;
  } else {
    html += `<div class="notes-login-hint">Pick your name (top-right) to add notes.</div>`;
  }

  html += `</div>`;
  return html;
}

function wireNotes() {
  const section = document.querySelector('.notes-section');
  if (!section) return;
  const bggId = Number(section.dataset.bgg);
  const player = localStorage.getItem('bgl-player');

  const rerender = () => {
    const cur = document.querySelector('.notes-section');
    if (!cur) return;
    cur.outerHTML = buildNotesHtml(bggId);
    wireNotes();
  };

  const addBtn = document.getElementById('note-add-btn');
  if (addBtn) {
    addBtn.addEventListener('click', async () => {
      const ta = document.getElementById('note-input');
      const text = (ta && ta.value || '').trim();
      if (!text || !player) return;
      addBtn.disabled = true;
      const id = 'n' + Date.now() + Math.random().toString(36).slice(2, 8);
      const now = Date.now();
      await saveNote(bggId, id, { text, author: player, createdAt: now, updatedAt: now });
      rerender();
    });
  }

  section.querySelectorAll('.note-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this note?')) return;
      await deleteNote(bggId, btn.dataset.id);
      rerender();
    });
  });

  section.querySelectorAll('.note-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const entry = btn.closest('.note-entry');
      if (!entry) return;
      const existing = (gameNotesCache[bggId] && gameNotesCache[bggId][id]) || {};
      entry.innerHTML = `
        <textarea class="note-textarea note-edit-area" rows="2"></textarea>
        <div class="note-edit-actions">
          <button class="note-add-btn note-save">Save</button>
          <button class="note-btn note-cancel">cancel</button>
        </div>`;
      const ta = entry.querySelector('.note-edit-area');
      ta.value = existing.text || '';
      ta.focus();
      entry.querySelector('.note-save').addEventListener('click', async () => {
        const text = (ta.value || '').trim();
        if (!text) return;
        await saveNote(bggId, id, {
          text,
          author: existing.author || player,
          createdAt: existing.createdAt || Date.now(),
          updatedAt: Date.now()
        });
        rerender();
      });
      entry.querySelector('.note-cancel').addEventListener('click', rerender);
    });
  });
}

// ── Pie Chart Builder ──
const PIE_COLORS = ['#e2b04a','#4fc3f7','#22c55e','#f87171','#a78bfa','#f59e0b','#ec4899','#14b8a6','#8b5cf6','#6366f1'];

function buildPieHtml(data, _passedTotal, title, maxVisible) {
  if (!data || Object.keys(data).length === 0) return '';
  const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]);
  // Use the SUM of the slice values, not the caller-supplied total. Locations
  // are optional on plays, so a "player total" coming in here would leave the
  // pie short of 360° and the percentages summing to <100%. Each chart should
  // describe what's *in* it, full circle.
  const total = sorted.reduce((sum, [, count]) => sum + count, 0);
  if (total <= 0) return '';
  let gradParts = [];
  let angle = 0;
  const items = [];
  sorted.forEach(([label, count], i) => {
    const pct = (count / total * 100);
    const color = PIE_COLORS[i % PIE_COLORS.length];
    gradParts.push(`${color} ${angle.toFixed(1)}deg ${(angle + pct * 3.6).toFixed(1)}deg`);
    angle += pct * 3.6;
    items.push({ label, count, pct: Math.round(pct), color });
  });
  const grad = `conic-gradient(${gradParts.join(',')})`;
  const limit = maxVisible && items.length > maxVisible ? maxVisible : items.length;
  const visibleHtml = items.slice(0, limit).map(it =>
    `<div class="pie-legend-item"><span class="pie-legend-dot" style="background:${it.color}"></span>${it.label}<span class="pie-legend-pct">${it.pct}%</span></div>`
  ).join('');
  const hiddenHtml = items.length > limit ? items.slice(limit).map(it =>
    `<div class="pie-legend-item"><span class="pie-legend-dot" style="background:${it.color}"></span>${it.label}<span class="pie-legend-pct">${it.pct}%</span></div>`
  ).join('') : '';
  const showMoreBtn = hiddenHtml ? `<div class="pie-legend-hidden" style="display:none">${hiddenHtml}</div><button class="pie-legend-more" onclick="var h=this.previousElementSibling;h.style.display=h.style.display==='none'?'block':'none';this.textContent=h.style.display==='none'?'Show more':'Show less'">Show more</button>` : '';
  return `<div class="chart-block">
    <div class="chart-block-title">${title}</div>
    <div class="pie-wrap">
      <div class="pie" style="background:${grad}"><div class="pie-center">${total}</div></div>
      <div class="pie-legend">${visibleHtml}${showMoreBtn}</div>
    </div>
  </div>`;
}

function buildChartsHtml(days, locations, total) {
  const dayPie = buildPieHtml(days, total, 'Play Days');
  const locPie = buildPieHtml(locations, total, 'Locations', 5);
  if (!dayPie && !locPie) return '';
  return `<div class="stats-section"><div class="chart-row">${dayPie}${locPie}</div></div>`;
}

// ── Explore (merged Games + Players + Stats) ──
let _exploreTab = 'games'; // active sub-tab; survives re-renders and modal round-trips

function showGamesView() {
  const container = document.getElementById('games-view');

  // ── Shared computations across all three sub-tabs ──
  const gamePlayCounts = {};
  const allDays = {};
  const allLocs = {};
  let totalPlays = 0;
  const playerStats = {};
  const allPlays = [];

  for (const bggId in PLAY_HISTORY) {
    const game = findGameByBggId(bggId)
      || { id: 'bgg_' + bggId, name: 'Game #' + bggId, bggId: Number(bggId), spineColor: '#555', categories: [] };
    for (const play of PLAY_HISTORY[bggId]) {
      totalPlays++;
      allPlays.push({ game, date: play.date, sc: play.sc, b: play.b || '' });
      if (!gamePlayCounts[bggId]) gamePlayCounts[bggId] = { game, count: 0 };
      gamePlayCounts[bggId].count++;

      const [y, m, d] = play.date.split('-').map(Number);
      const dow = new Date(y, m - 1, d).getDay();
      const dayName = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dow];
      allDays[dayName] = (allDays[dayName] || 0) + 1;

      const loc = play.l || '';
      if (loc) allLocs[loc] = (allLocs[loc] || 0) + 1;

      for (const s of play.sc) {
        if (HIDDEN_PLAYERS.has(s.n)) continue;
        if (!playerStats[s.n]) playerStats[s.n] = { plays: 0, wins: 0, games: new Set() };
        playerStats[s.n].plays++;
        if (s.w) playerStats[s.n].wins++;
        playerStats[s.n].games.add(Number(bggId));
      }
    }
  }
  allPlays.sort((a, b) => b.date.localeCompare(a.date));

  const gameRowHtml = (game, detail) => {
    const imgSrc = game.bggId >= 0 ? `images/${game.bggId}.jpg` : '';
    return `<div class="stats-game-row" data-bgg-id="${game.bggId}">
      ${imgSrc ? `<img class="stats-game-img" src="${imgSrc}" alt="" onerror="__imgFallback(this, ${game.bggId})">` : ''}
      <div class="stats-game-info">
        <div class="stats-game-name">${game.name}</div>
        <div class="stats-game-detail">${detail}</div>
      </div>
    </div>`;
  };

  // ── Games sub-tab ──
  const buildGamesTab = () => {
    const cutoff = (() => {
      const d = new Date();
      d.setDate(d.getDate() - 90);
      return d.toISOString().slice(0, 10);
    })();
    const recentCounts = {};
    for (const p of allPlays) {
      if (p.date < cutoff) continue;
      const id = p.game.bggId;
      if (!recentCounts[id]) recentCounts[id] = { game: p.game, count: 0, lastPlayed: '' };
      recentCounts[id].count++;
      if (p.date > recentCounts[id].lastPlayed) recentCounts[id].lastPlayed = p.date;
    }
    const mostPlayedRecent = Object.values(recentCounts)
      .sort((a, b) => b.count - a.count || b.lastPlayed.localeCompare(a.lastPlayed)).slice(0, 10);
    const topGames = Object.values(gamePlayCounts).sort((a, b) => b.count - a.count).slice(0, 15);

    const newestRatings = [];
    for (const bggId in ratingsCache) {
      for (const player in ratingsCache[bggId]) {
        const r = ratingsCache[bggId][player];
        const value = typeof r === 'number' ? r : (r && r.value) || 0;
        const updatedAt = (r && typeof r === 'object' && r.updatedAt) || 0;
        if (!value) continue;
        newestRatings.push({ bggId: Number(bggId), player, value, updatedAt });
      }
    }

      const game = findGameByBggId(r.bggId) || { name: 'Game #' + r.bggId, bggId: r.bggId };

      return `<div class="stats-game-row" data-bgg-id="${r.bggId}">
        ${imgSrc ? `<img class="stats-game-img" src="${imgSrc}" alt="" onerror="__imgFallback(this, ${r.bggId})">` : ''}
        <div class="stats-game-info">
          <div class="stats-game-name">${game.name}</div>
          <div class="stats-game-detail">${r.player} &middot; ${_timeAgo(r.updatedAt)}</div>
        </div>
        <div class="stats-game-wr" style="color:#e2b04a">&#9733; ${r.value}</div>
      </div>`;
    };

    return `
      <div class="stats-section">
        <input type="text" class="insights-search" id="games-search" placeholder="Search all games..." autocomplete="off">
        <div id="games-search-results"></div>
      </div>

      ${mostPlayedRecent.length > 0 ? `<div class="stats-section">
        <div class="stats-section-title">Most Played Recently</div>
        <div class="stats-player-sub" style="margin:-0.3rem 0 0.6rem">Last 90 days</div>
        ${mostPlayedRecent.map(gs => gameRowHtml(gs.game, `${gs.count} play${gs.count !== 1 ? 's' : ''} &middot; Last: ${_fmtDateShort(gs.lastPlayed)}`)).join('')}
      </div>` : ''}

      <div class="stats-section">
        <div class="stats-section-title">Most Played All-Time</div>
        ${topGames.map(gs => gameRowHtml(gs.game, `${gs.count} play${gs.count !== 1 ? 's' : ''}`)).join('')}
      </div>

      ${newestTop.length > 0 ? `<div class="stats-section">
        <div class="stats-section-title">Newest Ratings</div>
        ${newestTop.map(ratingRowHtml).join('')}

    .sort((a, b) => b.plays - a.plays);

      </div>
    </div>`;

  const buildStatsTab = () => {
    const playRowHtml = (p) => {
      const scoresHtml = p.sc.map(s => {
        const cls = s.w ? ' winner' : '';

        <div class="stats-recent-top">
          <span class="stats-recent-game">${p.game.name}</span>
          <span class="stats-recent-date">${_fmtDateShort(p.date)}</span>
        </div>
        <div class="play-scores" style="margin-top:0.3rem">${scoresHtml}</div>
        ${boardHtml}
      </div>`;
    };
    return `
      <div class="stats-section"><div class="chart-row">${buildPieHtml(allDays, totalPlays, 'Play Days')}${buildPieHtml(allLocs, totalPlays, 'Locations', 5)}</div></div>
      <div class="stats-section">
        <div class="stats-section-title">Recent Plays</div>
        ${allPlays.slice(0, 20).map(playRowHtml).join('')}
      </div>`;
  };

  const tabContent = _exploreTab === 'players' ? buildPlayersTab()
    : _exploreTab === 'stats' ? buildStatsTab()
    : buildGamesTab();

  const tabBtn = (key, label) =>
    `<button class="explore-tab${_exploreTab === key ? ' active' : ''}" data-tab="${key}">${label}</button>`;

  container.innerHTML = `
    <div class="stats-header">
      <div class="stats-player-name">Explore</div>
      <div class="stats-player-sub">${totalPlays} plays &middot; ${Object.keys(gamePlayCounts).length} games &middot; ${topPlayers.length} players</div>
    </div>
    <div class="explore-tabs">
      ${tabBtn('games', 'Games')}${tabBtn('players', 'Players')}${tabBtn('stats', 'Stats')}
    </div>
    ${tabContent}
  `;

  // Sub-tab switching
  container.querySelectorAll('.explore-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      if (_exploreTab === btn.dataset.tab) return;
      _exploreTab = btn.dataset.tab;
      showGamesView();
    });
  });

  // Wire game/play rows (covers every sub-tab's [data-bgg-id] rows)
  container.querySelectorAll('.stats-section [data-bgg-id]').forEach(el => {
    el.addEventListener('click', () => {
      const game = findGameByBggId(el.dataset.bggId);
      if (game) openModal(game);
    });
  });

  // Games sub-tab: search across every catalogue
  const searchEl = document.getElementById('games-search');
  if (searchEl) {
    const resultsEl = document.getElementById('games-search-results');
    const allGames = _allGames();
    const renderSearch = (q) => {
      if (!q) { resultsEl.innerHTML = ''; return; }
      const ql = q.toLowerCase();
      const matches = allGames
        .filter(g => (g.name || '').toLowerCase().includes(ql))
        .sort((a, b) => a.name.localeCompare(b.name))
        .slice(0, 20);
      if (!matches.length) { resultsEl.innerHTML = '<div class="stats-player-sub" style="padding:0.6rem">No matches</div>'; return; }
      resultsEl.innerHTML = matches.map(g => gameRowHtml(g, `${g.year || ''}${g.players ? ' &middot; ' + g.players + ' players' : ''}`)).join('');
      resultsEl.querySelectorAll('[data-bgg-id]').forEach(el => {
        el.addEventListener('click', () => {
          const game = findGameByBggId(el.dataset.bggId);
          if (game) openModal(game);
        });
      });
    };
    searchEl.addEventListener('input', () => renderSearch(searchEl.value.trim()));
  }

  // Players sub-tab: player search
  const playerSearchEl = document.getElementById('insights-player-search');
  if (playerSearchEl) {
    playerSearchEl.addEventListener('input', () => {
      const q = playerSearchEl.value.toLowerCase();
      const filtered = q ? topPlayers.filter(p => p.name.toLowerCase().includes(q)) : topPlayers;
      const listEl = document.getElementById('insights-player-list');
      listEl.innerHTML = _renderInsightsPlayers(filtered, wrColor);
      _wireInsightsPlayerClicks(listEl);
    });
    _wireInsightsPlayerClicks(container);
  }
}


// ── Games Tab ──
function _fmtDateShort(d) {
  const [y, m, day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m)-1]} ${parseInt(day)}, ${y}`;
}

function _timeAgo(ts) {
  if (!ts) return '';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  const d = Math.floor(s/86400);
  if (d < 30) return d + 'd ago';
  if (d < 365) return Math.floor(d/30) + 'mo ago';
  return Math.floor(d/365) + 'y ago';
}

function _allGames() {
  const seen = new Set();
  const all = [];
  // Merge every catalogue so the Games tab covers everyone's collection.
  // First-seen wins, and the source order is richest-metadata-first
  // (curated shelf → BGStats imports → the three per-person CSV libraries).
  const sources = [
    GAMES,
    Object.values(EXTRA_GAMES || {}),
    typeof GIANNIS_GAMES !== 'undefined' ? Object.values(GIANNIS_GAMES) : [],
    typeof LGEORGE_GAMES !== 'undefined' ? Object.values(LGEORGE_GAMES) : [],
    typeof DIMITRIS_GAMES !== 'undefined' ? Object.values(DIMITRIS_GAMES) : [],
  ];
  for (const src of sources) {
    (src || []).forEach(g => {
      if (g && g.bggId != null && !seen.has(g.bggId)) { seen.add(g.bggId); all.push(g); }
    });
  }
  return all;
}



// ── Leaderboard (Elo) ──
const AUZTRALIA_BGG_IDS = new Set([231581, 320110]); // base + Tasmania
const GAME_PLAYER_NAME = '__GAME__';

function _leaderboardRanksForPlay(sc, bggId) {
  if (!Array.isArray(sc) || sc.length < 1) return null;
  const isAuztralia = bggId && AUZTRALIA_BGG_IDS.has(Number(bggId));
  const winners = sc.filter(s => s && s.w === true);
  if (winners.length === 0) {
    // AuZtralia: if no human won, the Game wins for Elo purposes
    if (isAuztralia && sc.length >= 1) {
      const ranks = sc.map(s => ({ player: s.n, rank: 2 }));
      ranks.push({ player: GAME_PLAYER_NAME, rank: 1 });
      return ranks;
    }
    return null;
  }
  if (sc.length < 2) return null;
  if (winners.length === sc.length && !isAuztralia) return null; // everyone wins → coop (skip unless AuZtralia)
  // winners.length < sc.length: some won, some lost (including 2+ winners = tie/team)

  const parsed = sc.map(s => {
    if (s.s == null || s.s === '') return null;
    const t = String(s.s).trim();
    if (!t) return null;
    if (/^-?\d+(\.\d+)?$/.test(t)) return Number(t);
    // scores like "16+3+16" → sum
    if (/^[\d.+\-\s]+$/.test(t)) {
      try {
        const v = t.split('+').reduce((a, b) => a + Number(b.trim() || 0), 0);
        return isFinite(v) ? v : null;
      } catch (_) { return null; }
    }
    return null;
  });

  if (parsed.every(v => v !== null)) {
    const wScores = sc.map((s, i) => s.w ? parsed[i] : null).filter(v => v !== null);
    const lScores = sc.map((s, i) => !s.w ? parsed[i] : null).filter(v => v !== null);
    const minW = Math.min(...wScores), maxW = Math.max(...wScores);
    const minL = Math.min(...lScores), maxL = Math.max(...lScores);

    let dir = null;
    if (minW > maxL) dir = 'desc';
    else if (maxW < minL) dir = 'asc';

    if (dir) {
      const indexed = sc.map((s, i) => ({ s, n: parsed[i] }));
      indexed.sort((a, b) => dir === 'desc' ? b.n - a.n : a.n - b.n);
      const out = [];
      let prev = null, rank = 0;
      indexed.forEach((item, i) => {
        if (prev === null || item.n !== prev) { rank = i + 1; prev = item.n; }
        out.push({ player: item.s.n, rank });
      });
      return out;
    }
  }

  // Fallback: winners all at rank 1, losers all at rank 2
  return sc.map(s => ({ player: s.n, rank: s.w ? 1 : 2 }));
}

function _yearStartCutoff() {
  return new Date().getFullYear() + '-01-01';
}

// Compute the main Elo leaderboard for a closed past year [YYYY-01-01, YYYY-12-31].
// Returns { ratings, plays, lastPlayDate } similar to _computeEloLeaderboard.
// Used by the 'year-of-champ' achievement.
function _computeMainEloForYear(year) {
  const start = `${year}-01-01`;
  const end = `${year}-12-31`;
  const flat = [];
  for (const bggId in PLAY_HISTORY) {
    for (const p of PLAY_HISTORY[bggId]) {
      if (!p || !p.date || !Array.isArray(p.sc)) continue;
      if (p.date < start || p.date > end) continue;
      flat.push({ bggId: Number(bggId), date: p.date, t: p.t || p.date, sc: p.sc });
    }
  }
  flat.sort((a, b) => a.t.localeCompare(b.t));

  const ratings = {}, plays = {}, lastPlayDate = {};
  for (const play of flat) {
    const ranks = _leaderboardRanksForPlay(play.sc, play.bggId);
    if (!ranks) continue;
    const byName = {};
    for (const r of ranks) {
      const mapped = NAME_MAP[r.player] || r.player;
      if (!mapped) continue;
      if (byName[mapped] == null || r.rank < byName[mapped]) byName[mapped] = r.rank;
    }
    const participants = Object.keys(byName).map(n => ({ player: n, rank: byName[n] }));
    if (participants.length < 2) continue;
    const game = findGameByBggId(play.bggId);
    const cx = (game && typeof game.complexity === 'number' && game.complexity > 0) ? game.complexity : 2.5;
    const w = cx / 5;
    const lossMult = Math.min(1, Math.max(0.7, 3 / participants.length));
    for (const m of participants) {
      if (ratings[m.player] == null) ratings[m.player] = 1000;
      if (plays[m.player] == null) plays[m.player] = 0;
    }
    const pre = {}, preCount = {};
    for (const m of participants) { pre[m.player] = ratings[m.player]; preCount[m.player] = plays[m.player]; }
    const deltas = {};
    for (const m of participants) deltas[m.player] = 0;
    for (let i = 0; i < participants.length; i++) {
      for (let j = i + 1; j < participants.length; j++) {
        const a = participants[i], b = participants[j];
        if (a.rank === b.rank) continue;
        const winner = a.rank < b.rank ? a : b;
        const loser  = a.rank < b.rank ? b : a;
        const Rw = pre[winner.player], Rl = pre[loser.player];
        const Ew = 1 / (1 + Math.pow(10, (Rl - Rw) / 400));
        const Kw = preCount[winner.player] < 5 ? 48 : 32;
        const Kl = preCount[loser.player]  < 5 ? 48 : 32;
        deltas[winner.player] += Kw * w * (1 - Ew);
        deltas[loser.player]  -= Kl * w * (1 - Ew) * lossMult;
      }
    }
    for (const m of participants) {
      if (m.player === GAME_PLAYER_NAME) { ratings[m.player] = 1000; continue; }
      ratings[m.player] += deltas[m.player];
      plays[m.player]++;
      lastPlayDate[m.player] = play.date;
    }
  }
  delete ratings[GAME_PLAYER_NAME];
  return { ratings, plays, lastPlayDate };
}

// Replay every competitive play of the current year through the same Elo
// pipeline used by the leaderboard, capturing each participant's per-play
// delta. Returned as a Map keyed by `${bggId}|${date}|${idx}` so callers can
// look up the deltas for any specific play they hold.
function _computePerPlayElo(mode) {
  const yearStart = _yearStartCutoff();
  const flat = [];
  for (const bggId in PLAY_HISTORY) {
    const arr = PLAY_HISTORY[bggId];
    arr.forEach((p, idx) => {
      if (!p || !p.date || !Array.isArray(p.sc)) return;
      if (p.date < yearStart) return;
      if (mode === 'south' && !_isBoardSouthPlay(p)) return;
      flat.push({ bggId: Number(bggId), idx, p });
    });
  }
  // Replay oldest→newest — the exact reverse of the newest-first order the
  // plays lists render with, so each play's +/- deltas line up with where it
  // sits in the displayed list. Same-timestamp plays (one BGStats batch) can't
  // be separated by time, so we mirror the display tie-break in reverse:
  // descending bggId, then descending array index.
  flat.sort((a, b) => {
    const at = a.p.t || a.p.date;
    const bt = b.p.t || b.p.date;
    if (at !== bt) return at.localeCompare(bt);
    if (a.bggId !== b.bggId) return b.bggId - a.bggId;
    return b.idx - a.idx;
  });

  const ratings = {}, counts = {};
  const out = new Map();

  for (const { bggId, idx, p } of flat) {
    const ranks = _leaderboardRanksForPlay(p.sc, bggId);
    if (!ranks) continue;
    const byName = {};
    for (const r of ranks) {
      const mapped = NAME_MAP[r.player] || r.player;
      if (!mapped) continue;
      if (byName[mapped] == null || r.rank < byName[mapped]) byName[mapped] = r.rank;
    }
    const participants = Object.keys(byName).map(n => ({ player: n, rank: byName[n] }));
    if (participants.length < 2) continue;
    const game = findGameByBggId(bggId);
    const cx = (game && typeof game.complexity === 'number' && game.complexity > 0) ? game.complexity : 2.5;
    const w = cx / 5;
    const lossMult = Math.min(1, Math.max(0.7, 3 / participants.length));
    for (const m of participants) {
      if (ratings[m.player] == null) ratings[m.player] = 1000;
      if (counts[m.player] == null) counts[m.player] = 0;
    }
    const pre = {}, preCount = {};
    for (const m of participants) { pre[m.player] = ratings[m.player]; preCount[m.player] = counts[m.player]; }
    const deltas = {};
    for (const m of participants) deltas[m.player] = 0;
    for (let i = 0; i < participants.length; i++) {
      for (let j = i + 1; j < participants.length; j++) {
        const a = participants[i], b = participants[j];
        if (a.rank === b.rank) continue;
        const winner = a.rank < b.rank ? a : b;
        const loser  = a.rank < b.rank ? b : a;
        const Rw = pre[winner.player], Rl = pre[loser.player];
        const Ew = 1 / (1 + Math.pow(10, (Rl - Rw) / 400));
        const El = 1 - Ew;
        const Kw = preCount[winner.player] < 5 ? 48 : 32;
        const Kl = preCount[loser.player]  < 5 ? 48 : 32;
        deltas[winner.player] += Kw * w * (1 - Ew);
        deltas[loser.player]  -= Kl * w * El * lossMult;
      }
    }
    out.set(`${bggId}|${p.date}|${idx}`, deltas);
    for (const m of participants) {
      if (m.player === GAME_PLAYER_NAME) continue;
      ratings[m.player] += deltas[m.player];
      counts[m.player]++;
    }
  }
  return out;
}

// Known Board South regulars whose mere presence in a play is enough to
// classify it as a Board South play (in addition to the " - BS" suffix
// convention). Names here should match post-NAME_MAP canonical names.
const BOARD_SOUTH_REGULARS = new Set([
  'LGeorge', 'Θανος', 'Στιβ',
  'Γιαννης Φωτοπουλος', 'Ολγα Σιδερη', 'Μαντσος',
]);

// A play counts as Board South only if EITHER:
//   - the location is explicitly "Board South", OR
//   - LGeorge participated (LGeorge is the BS anchor — if he's at the table
//     it's Board South, otherwise it isn't, by the user's own rule).
// The " - BS" name suffix only marks individual *members* (see
// _isBoardSouthMember) — it doesn't promote a random play to BS on its own.
function _isBoardSouthPlay(p) {
  if (!p) return false;
  if (p.l === 'Board South') return true;
  if (Array.isArray(p.sc)) {
    for (const s of p.sc) {
      if (!s || typeof s.n !== 'string') continue;
      const canonical = (typeof NAME_MAP !== 'undefined' && NAME_MAP[s.n]) || s.n;
      if (canonical === 'LGeorge') return true;
    }
  }
  return false;
}

function _computeEloLeaderboard(mode) {
  const yearStart = _yearStartCutoff();
  const flat = [];
  for (const bggId in PLAY_HISTORY) {
    PLAY_HISTORY[bggId].forEach((p, idx) => {
      if (!p || !p.date || !Array.isArray(p.sc)) return;
      if (p.date < yearStart) return;
      if (mode === 'south' && !_isBoardSouthPlay(p)) return;
      flat.push({ bggId: Number(bggId), idx, date: p.date, t: p.t || p.date, sc: p.sc });
    });
  }
  // Replay oldest→newest. Full timestamp first (from the BGStats import) so
  // same-day plays keep chronological order. Plays from a single batch upload
  // share an identical timestamp, so we break that tie as the exact reverse of
  // the newest-first plays list (descending bggId, then descending array
  // index) — keeping the leaderboard, the per-play deltas and the displayed
  // play order all in agreement.
  flat.sort((a, b) => {
    if (a.t !== b.t) return a.t.localeCompare(b.t);
    if (a.bggId !== b.bggId) return b.bggId - a.bggId;
    return b.idx - a.idx;
  });

  const ratings = {};
  const plays = {};
  const lastPlayDate = {};
  const lastDelta = {};
  const firstPlayDate = {};
  const streaks = {}; // current consecutive-win streak per player

  for (const play of flat) {
    const ranks = _leaderboardRanksForPlay(play.sc, play.bggId);
    if (!ranks) continue;

    // Normalize names via NAME_MAP, dedupe duplicate names (keep best rank)
    const byName = {};
    for (const r of ranks) {
      const mapped = NAME_MAP[r.player] || r.player;
      if (!mapped) continue;
      if (byName[mapped] == null || r.rank < byName[mapped]) byName[mapped] = r.rank;
    }
    const participants = Object.keys(byName).map(n => ({ player: n, rank: byName[n] }));
    const N = participants.length;
    if (N < 2) continue;

    const game = findGameByBggId(play.bggId);
    const cx = (game && typeof game.complexity === 'number' && game.complexity > 0) ? game.complexity : 2.5;
    const w = cx / 5;
    const lossMult = Math.min(1, Math.max(0.7, 3 / N));

    for (const m of participants) {
      if (ratings[m.player] == null) ratings[m.player] = 1000;
      if (plays[m.player] == null) plays[m.player] = 0;
    }

    const pre = {}, preCount = {};
    for (const m of participants) {
      pre[m.player] = ratings[m.player];
      preCount[m.player] = plays[m.player];
    }

    const deltas = {};
    for (const m of participants) deltas[m.player] = 0;

    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const a = participants[i], b = participants[j];
        if (a.rank === b.rank) continue;
        const winner = a.rank < b.rank ? a : b;
        const loser  = a.rank < b.rank ? b : a;
        const Rw = pre[winner.player], Rl = pre[loser.player];
        const Ew = 1 / (1 + Math.pow(10, (Rl - Rw) / 400));
        const El = 1 - Ew;
        const Kw = preCount[winner.player] < 5 ? 48 : 32;
        const Kl = preCount[loser.player]  < 5 ? 48 : 32;
        deltas[winner.player] += Kw * w * (1 - Ew);
        deltas[loser.player]  -= Kl * w * El * lossMult;
      }
    }

    for (const m of participants) {
      if (m.player === GAME_PLAYER_NAME) {
        ratings[m.player] = 1000; // pin synthetic Game opponent at base
        continue;
      }
      ratings[m.player] += deltas[m.player];
      plays[m.player]++;
      lastPlayDate[m.player] = play.date;
      if (!firstPlayDate[m.player]) firstPlayDate[m.player] = play.date;
      lastDelta[m.player] = deltas[m.player];
      if (m.rank === 1) {
        streaks[m.player] = (streaks[m.player] || 0) + 1;
      } else {
        streaks[m.player] = 0;
      }
    }
  }

  delete ratings[GAME_PLAYER_NAME];
  return { ratings, plays, lastPlayDate, lastDelta, firstPlayDate, streaks };
}

function _computeRivalryOfYear(mode, forPlayer) {
  const cutoff = _yearStartCutoff();
  const focus = forPlayer ? (NAME_MAP[forPlayer] || forPlayer) : null;

  const pairs = {};
  for (const bggId in PLAY_HISTORY) {
    for (const play of PLAY_HISTORY[bggId]) {
      if (!play || !play.date || play.date < cutoff || !Array.isArray(play.sc)) continue;
      if (mode === 'south' && !_isBoardSouthPlay(play)) continue;
      const ranks = _leaderboardRanksForPlay(play.sc, bggId);
      if (!ranks) continue;
      const byName = {};
      for (const r of ranks) {
        if (r.player === GAME_PLAYER_NAME) continue;
        const m = NAME_MAP[r.player] || r.player;
        if (!m) continue;
        if (byName[m] == null || r.rank < byName[m]) byName[m] = r.rank;
      }
      const list = Object.entries(byName);
      if (list.length < 2) continue;
      // If we have a focus player, skip plays they weren't in
      if (focus && byName[focus] == null) continue;
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          const [n1, r1] = list[i];
          const [n2, r2] = list[j];
          // If focusing on a player, only consider pairs that include them
          if (focus && n1 !== focus && n2 !== focus) continue;
          // In Board South mode, both members of the pair must be BS members.
          if (mode === 'south' && (!_isBoardSouthMember(n1) || !_isBoardSouthMember(n2))) continue;
          const [a, b] = n1 < n2 ? [n1, n2] : [n2, n1];
          const aRank = a === n1 ? r1 : r2;
          const bRank = a === n1 ? r2 : r1;
          const key = a + '||' + b;
          if (!pairs[key]) pairs[key] = { a, b, total: 0, aWins: 0, bWins: 0, lastDate: '' };
          pairs[key].total++;
          if (aRank < bRank) pairs[key].aWins++;
          else if (bRank < aRank) pairs[key].bWins++;
          if (play.date > pairs[key].lastDate) pairs[key].lastDate = play.date;
        }
      }
    }
  }

  let best = null;
  if (mode === 'south') {
    // Board South rivalry — unchanged: most-played pair, then closest by
    // absolute win-difference.
    for (const k in pairs) {
      const p = pairs[k];
      if (p.total < 2) continue;
      const closeness = Math.abs(p.aWins - p.bWins);
      if (!best) { best = p; continue; }
      const bestCloseness = Math.abs(best.aWins - best.bWins);
      if (p.total > best.total) best = p;
      else if (p.total === best.total && closeness < bestCloseness) best = p;
    }
  } else {
    // Main rivalry — only pairs played within the last 2 months count, and
    // we pick the *proportionally* closest head-to-head record: |aWins-bWins|
    // divided by total games. So 90–100 (ratio 0.05) beats 4–12 (ratio 0.50).
    // Total games is only a tie-breaker when two pairs are equally close.
    const twoMonthsAgo = (() => {
      const d = new Date();
      d.setMonth(d.getMonth() - 2);
      return d.toISOString().slice(0, 10);
    })();
    const ratio = (p) => Math.abs(p.aWins - p.bWins) / p.total;
    for (const k in pairs) {
      const p = pairs[k];
      if (p.total < 2) continue;
      if (p.lastDate < twoMonthsAgo) continue; // recency gate
      if (!best) { best = p; continue; }
      const r = ratio(p), rBest = ratio(best);
      if (r < rBest) best = p;
      else if (r === rBest && p.total > best.total) best = p;
    }
  }
  return best;
}

function _eloToColorScore(elo) {
  // Map Elo to a 0–10 rating scale used by ratingColor().
  // 850 → 0 (red), 1000 → 5 (yellow), 1150+ → 10 (green).
  return Math.max(0, Math.min(10, (elo - 850) / 30));
}

let _leaderboardMode = 'main'; // 'main' | 'south' — kept for legacy callers; UI now splits across tabs
let _bsSubTab = 'leaderboard'; // 'leaderboard' | 'vote' — used by the dedicated Board South tab

// A canonical name belongs on the Board South leaderboard only if it's a
// known BS regular OR carries the " - BS" disambiguation suffix. Random
// people who happened to show up to a BS night don't get ranked here.
function _isBoardSouthMember(canonicalName) {
  if (!canonicalName) return false;
  if (BOARD_SOUTH_REGULARS.has(canonicalName)) return true;
  if (typeof canonicalName === 'string' && canonicalName.includes(' - BS')) return true;
  return false;
}

function _renderEloLeaderboardInto(container, mode) {
  const isSouth = mode === 'south';
  const data = _computeEloLeaderboard(mode);
  const currentYear = new Date().getFullYear();

  const rows = Object.keys(data.ratings)
    .filter(p => data.plays[p] >= 1)
    .filter(p => !isSouth || _isBoardSouthMember(p))
    .map(p => ({
      name: p,
      elo: Math.round(data.ratings[p]),
      plays: data.plays[p],
      lastPlayed: data.lastPlayDate[p],
      lastDelta: data.lastDelta[p] || 0,
      provisional: data.plays[p] < 5,
      streak: data.streaks[p] || 0,
    }))
    .sort((a, b) => b.elo - a.elo);

  const titleTxt = isSouth ? `Board South ${currentYear}` : `Leaderboard ${currentYear}`;

  const rawPlayer = localStorage.getItem('bgl-player');
  const focusPlayer = rawPlayer ? (NAME_MAP[rawPlayer] || rawPlayer) : null;
  const rivalry = _computeRivalryOfYear(mode, focusPlayer);
  const rivalryHead = focusPlayer ? '🔥 Your Top Rival' : '🔥 Top Rivalry';
  const rivalryHtml = rivalry ? `
    <div class="lb-rivalry">
      <div class="lb-rivalry-head">${rivalryHead}</div>
      <div class="lb-rivalry-body">
        <span class="lb-rivalry-name" data-visit-player="${rivalry.a.replace(/"/g, '&quot;')}">${rivalry.a}</span>
        <span class="lb-rivalry-score">${rivalry.aWins}–${rivalry.bWins}</span>
        <span class="lb-rivalry-name" data-visit-player="${rivalry.b.replace(/"/g, '&quot;')}">${rivalry.b}</span>
      </div>
      <div class="lb-rivalry-meta">${rivalry.total} play${rivalry.total !== 1 ? 's' : ''} in ${currentYear} · last ${_fmtDateShort(rivalry.lastDate)}</div>
    </div>` : '';

  if (rows.length === 0) {
    container.innerHTML = `
      <div class="lb-header">
        <div class="lb-title">${titleTxt}</div>
      </div>
      <div class="lb-empty">No active players to rank yet.</div>`;
    return;
  }

  const podium = rows.slice(0, Math.min(3, rows.length));
  const rest = rows.slice(podium.length);
  const medals = ['🥇', '🥈', '🥉'];
  const slotOrder = podium.length === 3 ? [1, 0, 2]
                   : podium.length === 2 ? [1, 0]
                   : [0];

  const podiumHtml = slotOrder.map(idx => {
    const p = podium[idx];
    if (!p) return '';
    const color = ratingColor(_eloToColorScore(p.elo));
    const initial = p.name.charAt(0).toUpperCase();
    const prov = p.provisional ? '<span class="lb-prov-badge">PROV</span>' : '';
    const streakHtml = p.streak >= 2 ? `<span class="lb-streak" title="${p.streak}-win streak">🔥 ${p.streak}</span>` : '';
    // Show the most recent point delta on the podium too — same convention as
    // the list rows below (green for gain, red for loss, dim for zero).
    const deltaCls = p.lastDelta > 0 ? 'pos' : (p.lastDelta < 0 ? 'neg' : '');
    const deltaSign = p.lastDelta > 0 ? '+' : '';
    const deltaTxt = `${deltaSign}${p.lastDelta.toFixed(1)}`;
    return `<div class="lb-podium-card rank-${idx + 1}" data-visit-player="${p.name.replace(/"/g, '&quot;')}">
      <div class="lb-podium-medal">${medals[idx]}</div>
      <div class="lb-podium-avatar">${initial}</div>
      <div class="lb-podium-name">${p.name}${prov}${streakHtml}</div>
      <div class="lb-podium-elo" style="color:${color}">${p.elo}</div>
      <div class="lb-podium-delta ${deltaCls}">${deltaTxt}</div>
      <div class="lb-podium-meta">${p.plays} play${p.plays !== 1 ? 's' : ''} · last ${_fmtDateShort(p.lastPlayed)}</div>
    </div>`;
  }).join('');

  const listHtml = rest.map((p, i) => {
    const rank = podium.length + i + 1;
    const color = ratingColor(_eloToColorScore(p.elo));
    const initial = p.name.charAt(0).toUpperCase();
    const deltaCls = p.lastDelta > 0 ? 'pos' : (p.lastDelta < 0 ? 'neg' : '');
    const deltaSign = p.lastDelta > 0 ? '+' : '';
    const deltaTxt = `${deltaSign}${p.lastDelta.toFixed(1)}`;
    const prov = p.provisional ? '<span class="lb-prov-badge">PROV</span>' : '';
    const streakHtml = p.streak >= 2 ? `<span class="lb-streak" title="${p.streak}-win streak">🔥 ${p.streak}</span>` : '';
    return `<div class="lb-row" data-visit-player="${p.name.replace(/"/g, '&quot;')}">
      <div class="lb-rank">${rank}</div>
      <div class="lb-avatar">${initial}</div>
      <div class="lb-name-block">
        <div class="lb-name">${p.name}${prov}</div>
        <div class="lb-sub"><span>${p.plays} play${p.plays !== 1 ? 's' : ''}</span>${streakHtml}</div>
      </div>
      <div class="lb-elo-block">
        <div class="lb-elo" style="color:${color}">${p.elo}</div>
        <div class="lb-delta ${deltaCls}">${deltaTxt}</div>
      </div>
    </div>`;
  }).join('');

  container.innerHTML = `
    <div class="lb-header">
      <div class="lb-title">${titleTxt}</div>
      <div class="lb-count">${rows.length} player${rows.length !== 1 ? 's' : ''}</div>
    </div>
    ${rivalryHtml}
    ${podium.length > 0 ? `<div class="lb-podium">${podiumHtml}</div>` : ''}
    <div class="lb-list">${listHtml}</div>
    <div class="lb-explain">
      ${isSouth ? '<b>Board South League:</b> A separate Elo using only plays where the location is "Board South". Independent of the main leaderboard.<br><br>' : ''}<b>How it works:</b> Everyone starts at 1000 on Jan 1. Each play of ${currentYear} replays in date order — winners gain, losers drop, with bigger swings when the underdog wins. Complexity scales points (a win on weight 5 = full value, lighter games = less). Losses scale down with player count, and finishing last costs more than finishing mid-pack. <b>PROV</b> means fewer than 5 plays this year (points move faster). The leaderboard resets every January 1st.
    </div>
    ${isSouth ? _boardSouthPlaysSectionHtml() : ''}`;

  container.querySelectorAll('[data-visit-player]').forEach(el => {
    el.addEventListener('click', () => {
      showStatsView(el.dataset.visitPlayer, 'visiting');
      window.scrollTo(0, 0);
    });
  });
}

function showLeaderboardView() {
  // Top-level Leaderboard tab now shows only the Main Elo league.
