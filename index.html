<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
<script>
  // Touch devices open on the Library (zoomed-out shelf view). Set the
  // viewport synchronously before CSS renders so the mobile-library h1 size
  // (which is tuned for a 1200-css-pixel viewport) doesn't flash huge under
  // device-width for a split second. Keep in sync with VP_LIBRARY below.
  (function(){
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      var vp = document.querySelector('meta[name=viewport]');
      if (vp) vp.setAttribute('content', 'width=1200, user-scalable=yes');
      document.documentElement.classList.add('pre-mobile-library');
    }
    // If there's already a saved player, the post-Firebase boot code will
    // jump to the Profile view. Tag <html> so CSS can hide the library
    // shell on the very first paint and avoid a library→profile flicker.
    try {
      if (localStorage.getItem('bgl-player')) {
        document.documentElement.classList.add('boot-to-profile');
      }
    } catch (_) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<body>
<script>
  // Match the early viewport toggle in <head>: add mobile-library to body
  // immediately so the h1 and shelf render at the correct size on the very
  // first paint (otherwise h1 flashes huge under device-width).
  // BUT if we're booting straight into the profile, skip that — the library
  // shell is hidden, and mobile-library would force a 1200-px body width
  // that horizontally overflows on a 375-px phone in profile view.
  if (
    document.documentElement.classList.contains('pre-mobile-library') &&
    !document.documentElement.classList.contains('boot-to-profile')
  ) {
    document.body.classList.add('mobile-library');
  }
  // Pre-flip the active tab indicator + viewport so the player-bar reflects
  // the destination view on first paint instead of flashing "Library".
  if (document.documentElement.classList.contains('boot-to-profile')) {
    var libBtn = document.getElementById('btn-library');
    var profBtn = document.getElementById('btn-mystats');
    if (libBtn) libBtn.classList.remove('active');
    if (profBtn) profBtn.classList.add('active');
    var statsView = document.getElementById('stats-view');
    if (statsView) statsView.classList.add('open');
    // Touch devices: lock the viewport so we don't flash a 1200-px layout
    // before the JS-side switchTo runs.
    if (document.documentElement.classList.contains('pre-mobile-library')) {
      var vp2 = document.querySelector('meta[name=viewport]');
      if (vp2) vp2.setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no');
    }
  }
</script>

<h1>Board Game Library</h1>

<div class="player-bar" id="player-bar">
  <button class="player-bar-btn active" id="btn-library">Library</button>
  <button class="player-bar-btn" id="btn-ilioupoli" style="display:none">Ilioupoli Bros</button>
  <button class="player-bar-btn" id="btn-games">Explore</button>
  <button class="player-bar-btn" id="btn-mystats">Profile</button>
  <button class="player-bar-btn" id="btn-leaderboard">Leaderboard</button>
  <button class="player-bar-btn" id="btn-achievements">Achievements</button>
  <button class="player-bar-btn" id="btn-challenges">Challenges</button>
  <button class="player-bar-btn" id="btn-boardsouth" style="display:none">Board South</button>
</div>

<div id="library-view">
<div class="search-wrap">
  <span class="search-icon">&#128269;</span>
  <input type="text" class="search-input" id="search-input" placeholder="Search games..." autocomplete="off">
</div>

<div class="filters" id="filters">
  <div class="filter-group">
    <span class="filter-label">Category</span>
    <div class="filter-multi" id="f-category-wrap">
      <button class="filter-multi-btn" id="f-category-btn">All <span class="filter-arrow">&#9662;</span></button>
      <div class="filter-multi-dropdown" id="f-category-dd"></div>
    </div>
  </div>
  <div class="filter-group">
    <span class="filter-label">Type</span>
    <select class="filter-select" id="f-coop">
      <option value="">All</option>
      <option value="coop">Co-op</option>
      <option value="competitive">Competitive</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Players</span>
    <div class="filter-multi" id="f-players-wrap">
      <button class="filter-multi-btn" id="f-players-btn">Any <span class="filter-arrow">&#9662;</span></button>
      <div class="filter-multi-dropdown" id="f-players-dd"></div>
    </div>
  </div>
  <div class="filter-group">
    <span class="filter-label">Difficulty</span>
    <select class="filter-select" id="f-difficulty">
      <option value="">All</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Game</span>
    <select class="filter-select" id="f-expansion">
      <option value="">All</option>
      <option value="core">Core Games</option>
      <option value="expansion">Expansions</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Max Play Time</span>
    <div class="filter-slider-wrap">
      <input type="range" class="filter-slider" id="f-time" min="15" max="240" value="240" step="15">
      <span class="filter-slider-value" id="f-time-val">Any</span>
    </div>
  </div>
  <div class="filter-group">
    <span class="filter-label">Include</span>
    <div class="filter-checks">
      <label class="filter-check"><input type="checkbox" id="f-campaign" checked> Campaign / Legacy</label>
    </div>
  </div>
  <button class="filter-reset" id="f-reset">Reset</button>
  <span id="f-count"></span>
</div>

<div class="shelf-wrapper">
  <div class="shelf" id="shelf"></div>
</div>
<div style="text-align:center;margin:1rem 0 0.5rem">
  <button id="btn-other-side" style="background:#2a2218;color:#4fc3f7;border:2px solid #4fc3f7;padding:0.5rem 1.5rem;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;letter-spacing:0.03em;transition:all 0.2s" onmouseover="this.style.background='#4fc3f7';this.style.color='#1a1208'" onmouseout="this.style.background='#2a2218';this.style.color='#4fc3f7'">&#x21C4; Show Other Side</button>
</div>
</div><!-- /library-view -->

<div class="stats-view" id="stats-view"></div>
<div class="stats-view" id="games-view"></div>
<div class="stats-view" id="leaderboard-view"></div>
<div class="stats-view" id="achievements-view"></div>
<div class="stats-view" id="challenges-view"></div>
<div class="stats-view" id="boardsouth-view"></div>
<div class="stats-view" id="ilioupoli-view"></div>

<!-- Latest Plays full-log modal -->
<div class="lpm-overlay" id="lpm-overlay" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lpm-modal">
    <div class="lpm-head">
      <div class="lpm-title" id="lpm-title">All Plays</div>
      <div class="lpm-count" id="lpm-count"></div>
      <button class="lpm-close" id="lpm-close" aria-label="Close">×</button>
    </div>
    <div class="lpm-list" id="lpm-list"></div>
  </div>
</div>

<!-- Player Picker Overlay -->
<div class="picker-overlay" id="picker-overlay">
  <div class="picker-box">
    <div class="picker-header">
      <div class="picker-title">Who's playing?</div>
      <div class="picker-subtitle">Pick your name to see your stats</div>
      <input type="text" class="picker-search" id="picker-search" placeholder="Search players..." autocomplete="off">
    </div>
    <div class="picker-list" id="picker-list"></div>
    <button class="picker-skip" id="picker-skip">Just browse the library</button>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <button class="modal-fav-btn" id="modal-fav" title="Add to favorites">&#9733;</button>
    <button class="modal-close" id="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<div class="wr-overlay" id="wrapped-overlay" aria-hidden="true"></div>
