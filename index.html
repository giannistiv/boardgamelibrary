<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<script>
  // Touch devices showing the zoomed-out shelf need the 1200-px viewport; set
  // it before CSS renders so the page doesn't flash at device width. Phones
  // open the Library as a grid of covers instead (normal viewport), unless
  // the shelf was picked. Keep in sync with VP_LIBRARY and _libZoomedShelf().
  (function(){
    var touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    var mode = null;
    try { mode = localStorage.getItem('bgl-libmode'); } catch (_) {}
    var phone = Math.min(screen.width, screen.height) < 700;
    var html = document.documentElement;
    if (touch && (mode ? mode === 'shelf' : !phone)) {
      var vp = document.querySelector('meta[name=viewport]');
      if (vp) vp.setAttribute('content', 'width=1200, user-scalable=yes, viewport-fit=cover');
      html.classList.add('pre-mobile-library');
      var land = screen.width > screen.height;
      html.style.setProperty('--libzoom', String(1200 / (land ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height))));
    }
    // Phone layout (bottom tab bar) from the first paint; nav.js keeps it current.
    if (phone || window.innerWidth < 900 || html.classList.contains('pre-mobile-library')) html.classList.add('compact');
    // If there's already a saved player, the post-Firebase boot code will
    // jump to the Profile view. Tag <html> so CSS can hide the library
    // shell on the very first paint and avoid a library→profile flicker.
    try {
      if (localStorage.getItem('bgl-player')) {
        document.documentElement.classList.add('boot-to-profile');
      }
    } catch (_) {}
  })();
</script>

<body>
<script>
  // Match the early viewport toggle in <head>: add mobile-library to body
  // immediately so the h1 and shelf render at the correct size on the very
  // first paint (otherwise h1 flashes huge under device-width).
  // BUT if we're booting straight into the profile, skip that — the library
  // shell is hidden, and mobile-library would force a 1200-px body width
  // that horizontally overflows on a 375-px phone in profile view.
  if (
    document.documentElement.classList.contains('pre-mobile-library') &&
    !document.documentElement.classList.contains('boot-to-profile')
  ) {
    document.body.classList.add('mobile-library');
  }
  // Pre-flip the active tab indicator + viewport so the player-bar reflects
  // the destination view on first paint instead of flashing "Library".
  if (document.documentElement.classList.contains('boot-to-profile')) {
    var libBtn = document.getElementById('btn-library');
    var profBtn = document.getElementById('btn-mystats');
    if (libBtn) libBtn.classList.remove('active');
    if (profBtn) profBtn.classList.add('active');
    var statsView = document.getElementById('stats-view');
    if (statsView) statsView.classList.add('open');
    // Touch devices: lock the viewport so we don't flash a 1200-px layout
    // before the JS-side switchTo runs.
    if (document.documentElement.classList.contains('pre-mobile-library')) {
      var vp2 = document.querySelector('meta[name=viewport]');
      if (vp2) vp2.setAttribute('content', 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
    }
  }
</script>

  <button class="player-bar-btn" id="btn-boardsouth" style="display:none">Board South</button>

<div id="library-view">
<div class="lib-head">
  <div class="lib-title-row">
    <div class="page-head">
      <h1 class="page-title">The shelf</h1>
      <div class="page-sub" id="lib-sub"></div>
    </div>
    <div class="seg" id="lib-mode" role="tablist" aria-label="Library view">
      <button type="button" class="seg-btn" data-mode="shelf" role="tab">Shelf</button>
      <button type="button" class="seg-btn" data-mode="covers" role="tab">Covers</button>
    </div>
  </div>
  <div class="lib-tools">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></span>
      <input type="text" class="search-input" id="search-input" placeholder="Search the shelf" autocomplete="off">
    </div>
    <button type="button" class="lib-filter-toggle" id="lib-filter-toggle" aria-expanded="false" aria-controls="filters">Filters</button>
  </div>

<div class="filters" id="filters">

      <button class="filter-multi-btn" id="f-category-btn">All <span class="filter-arrow">&#9662;</span></button>
      <div class="filter-multi-dropdown" id="f-category-dd"></div>
    </div>
  </div>
  <div class="filter-group">
    <span class="filter-label">Type</span>
    <select class="filter-select" id="f-coop">
      <option value="">All</option>
      <option value="coop">Co-op</option>
      <option value="competitive">Competitive</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Players</span>
    <div class="filter-multi" id="f-players-wrap">
      <button class="filter-multi-btn" id="f-players-btn">Any <span class="filter-arrow">&#9662;</span></button>
      <div class="filter-multi-dropdown" id="f-players-dd"></div>
    </div>
  </div>
  <div class="filter-group">
    <span class="filter-label">Difficulty</span>
    <select class="filter-select" id="f-difficulty">
      <option value="">All</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Game</span>
    <select class="filter-select" id="f-expansion">
      <option value="">All</option>
      <option value="core">Core Games</option>
      <option value="expansion">Expansions</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="filter-label">Max Play Time</span>
    <div class="filter-slider-wrap">
      <input type="range" class="filter-slider" id="f-time" min="15" max="240" value="240" step="15">
      <span class="filter-slider-value" id="f-time-val">Any</span>
    </div>
  </div>
  <div class="filter-group">
    <span class="filter-label">Include</span>
    <div class="filter-checks">
      <label class="filter-check"><input type="checkbox" id="f-campaign" checked> Campaign / Legacy</label>
    </div>
  </div>
  <button class="filter-reset" id="f-reset">Reset</button>
  <span id="f-count"></span>
</div>

</div><!-- /lib-head -->
<div class="shelf-wrapper">
  <div class="shelf" id="shelf"></div>
</div>
<div class="other-side-row">
  <button type="button" id="btn-other-side" class="btn-ghost">&#x21C4; Show Other Side</button>
</div>
<div class="lib-covers" id="lib-covers"></div>
